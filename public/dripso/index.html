<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://www.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <title>드립소 - 모두가 한마디씩 보태는 유머 놀이터</title>
  <meta name="description" content="주제를 올리고 다른 사람들이 댓글 드립을 달며, 좋아요를 많이 받은 한마디가 위로 올라오는 참여형 유머 커뮤니티입니다.">
  <meta name="theme-color" content="#17121f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="드립소 - 한마디가 모이는 곳">
  <meta property="og:description" content="오늘의 한줄, 이름짓기, 상황드립에 참여하고 베스트 드립을 골라보세요.">
  <link rel="icon" href="/icons/favicon-32.png?v=20260729-brand-unified-1" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dripso/dripso.css?v=20260801-community-1">
</head>
<body>
  <header class="site-header">
    <a class="dripso-brand" href="/dripso/#/" aria-label="드립소 홈">
      <span class="brand-mark" aria-hidden="true">ㅋ</span>
      <span class="brand-copy"><strong>드립소</strong><small>한마디가 모이는 곳</small></span>
    </a>
    <div class="header-actions">
      <a class="court-link" href="/">판결소</a>
      <a class="account-link" id="account-link" href="/#/auth">로그인</a>
    </div>
  </header>

  <main id="dripso-app" tabindex="-1">
    <section class="loading-card" aria-live="polite">드립을 불러오는 중입니다.</section>
  </main>

  <button class="write-fab" id="open-topic-dialog" type="button" aria-label="새 드립 주제 등록">＋</button>

  <nav class="dripso-bottom-nav" aria-label="드립소 메뉴">
    <a href="#/" data-nav="home"><span aria-hidden="true">🏠</span><small>홈</small></a>
    <a href="#/daily" data-nav="daily"><span aria-hidden="true">💬</span><small>오늘의 한줄</small></a>
    <a href="#/naming" data-nav="naming"><span aria-hidden="true">🏷️</span><small>이름짓기</small></a>
    <a href="#/situation" data-nav="situation"><span aria-hidden="true">🎭</span><small>상황드립</small></a>
    <a href="#/popular" data-nav="popular"><span aria-hidden="true">🔥</span><small>인기</small></a>
  </nav>

  <dialog class="topic-dialog" id="topic-dialog">
    <form id="topic-form" method="dialog">
      <div class="dialog-heading">
        <div><span>새 주제</span><h2>드립 판을 열어주세요</h2></div>
        <button class="dialog-close" id="close-topic-dialog" type="button" aria-label="닫기">×</button>
      </div>
      <label>메뉴
        <select id="topic-type" name="type" required>
          <option value="daily">오늘의 한줄</option>
          <option value="naming">이름짓기</option>
          <option value="situation">상황드립</option>
        </select>
      </label>
      <label>제목
        <input id="topic-title" name="title" maxlength="60" required placeholder="예: 월요일 출근을 한 줄로 표현한다면?">
      </label>
      <label>설명
        <textarea id="topic-prompt" name="prompt" maxlength="300" required placeholder="다른 사람들이 어떤 드립을 달면 되는지 알려주세요."></textarea>
      </label>
      <p class="form-help">개인정보, 실명 공격, 욕설이 포함된 내용은 등록되지 않습니다.</p>
      <button class="submit-button" id="topic-submit" type="submit">주제 등록하기</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/dripso/dripso.js?v=20260801-community-1"></script>
</body>
</html>
