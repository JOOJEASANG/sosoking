<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b101a">
  <title>로그인 · 소소킹 플레이</title>
  <meta name="description" content="소소킹 플레이 로그인 및 회원가입">
  <script src="/js/theme-init.js?v=20260816-play-brand-1"></script>
  <link rel="icon" href="/icons/favicon-32.png?v=20260816-play-brand-1" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth/auth.css?v=20260818-auth-1">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="/">🎮 <strong>소소킹 플레이</strong></a>
    <section class="auth-card">
      <div class="auth-heading">
        <span class="eyebrow">SOSOKING ACCOUNT</span>
        <h1 id="auth-title">로그인</h1>
        <p id="auth-description">로그인하면 내 닉네임으로 방을 만들고 어디서든 이어서 플레이할 수 있습니다.</p>
      </div>

      <button id="google-button" class="google-button" type="button"><span class="google-mark">G</span> Google로 계속하기</button>
      <div class="auth-divider"><span>또는 이메일</span></div>

      <form id="email-form" novalidate>
        <label class="field"><span>이메일</span><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상" required></label>
        <div id="nickname-wrap" class="field hidden"><span>닉네임</span><div class="nickname-row"><input id="nickname" type="text" maxlength="12" autocomplete="nickname" placeholder="2~12자"><button id="check-nickname" type="button">중복 확인</button></div><small id="nickname-status" class="field-status"></small></div>
        <button id="email-submit" class="primary-button" type="submit">로그인</button>
      </form>

      <button id="mode-toggle" class="text-button" type="button">처음이신가요? 회원가입</button>
      <button id="reset-button" class="text-button secondary" type="button">비밀번호를 잊으셨나요?</button>
      <p id="auth-message" class="auth-message" aria-live="polite"></p>
    </section>
    <p class="auth-note">회원가입 시 입력한 이메일·닉네임은 소소킹 계정과 게임방 참가자 표시를 위해 사용됩니다.</p>
  </main>
  <script type="module" src="/auth/auth.js?v=20260818-auth-1"></script>
</body>
</html>
