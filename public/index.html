<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>새 프로젝트</title>
    <meta name="description" content="Firebase Hosting 위에서 새로 시작하는 프로젝트입니다." />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <h1>새 프로젝트 준비 중</h1>
      <p>
        기존 앱 코드를 모두 비우고 Firebase Hosting · Firestore · Functions 배포 설정만
        남긴 상태입니다. 여기부터 새 앱을 만들어 갑니다.
      </p>
      <ul class="checklist">
        <li>Hosting: <code>public/</code></li>
        <li>Functions: <code>functions/</code> (아직 배포 대상 없음)</li>
        <li>Firestore 규칙: <code>firestore.rules</code> (기본 차단)</li>
      </ul>
    </main>
  </body>
</html>
