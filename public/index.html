<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>소소킹 V2 준비 중</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f7f9; color: #17191c; }
    main { width: min(560px, 100%); padding: 40px 28px; border: 1px solid #e2e5e9; border-radius: 20px; background: #fff; text-align: center; }
    h1 { margin: 0 0 14px; font-size: 28px; }
    p { margin: 0; color: #626973; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>소소킹 V2 기획 중</h1>
    <p>기존 서비스를 안전하게 백업하고 새로운 참여형 서비스를 준비하고 있습니다.</p>
  </main>
</body>
</html>
