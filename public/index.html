<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8f8f7">
  <title>소소킹 | 새롭게 준비 중</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: #f8f8f7; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif; }
    main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .message { width: min(100%, 490px); text-align: center; }
    .brand { display: inline-block; margin: 0 0 34px; padding-bottom: 13px; border-bottom: 1px solid #333; font-size: 16px; font-weight: 800; letter-spacing: -.04em; }
    h1 { font-size: clamp(25px, 5vw, 36px); line-height: 1.5; letter-spacing: -.065em; font-weight: 700; margin: 0; word-break: keep-all; }
    p { margin: 19px 0 0; color: #777; font-size: 14px; line-height: 1.9; }
    .foot { position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; color: #aaa; font-size: 11px; letter-spacing: .12em; }
  </style>
  <script src="/reset.js" defer></script>
</head>
<body>
  <main>
    <div class="message">
      <div class="brand">소소킹</div>
      <h1>새로운 사이트를<br>준비하고 있습니다.</h1>
      <p>지금은 기존 서비스를 종료하고<br>새로운 구성을 준비하는 중입니다.</p>
    </div>
  </main>
  <div class="foot">SOSOKING</div>
</body>
</html>
