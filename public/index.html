<!doctype html>

<body>

<div class="site">
  <header class="site-head">
    <div class="brand"><img src="/mark.svg" alt="" width="42" height="42"><div><b>물결우체국</b><small>TIDEPOST</small></div></div>
    <nav aria-label="게임 메뉴">
      <button class="nav-btn" id="rules-btn" type="button"><svg class="icon"><use href="#i-book"/></svg><span>게임 방법</span></button>
      <button class="icon-btn" id="sound-btn" type="button" aria-label="효과음 켜기" aria-pressed="false"></button>
    </nav>
  </header>
  <main id="main"><p class="loading">항구를 열고 있어요…</p></main>
  <footer><span><svg class="icon"><use href="#i-waves"/></svg> 물결우체국</span><span>소소킹의 보드게임</span></footer>
</div>

<noscript>게임을 실행하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
<script type="module" src="/js/app.js"></script>
