name: Analyze repository reachability

on:
  push:
    branches:
      - cleanup/community-repository

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build reachability report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import deque
          from pathlib import Path

          root = Path.cwd()
          public = root / "public"
          functions = root / "functions"

          def rel(path: Path) -> str:
              return path.relative_to(root).as_posix()

          def clean_ref(value: str) -> str:
              return value.split("?", 1)[0].split("#", 1)[0]

          def resolve(from_file: Path, value: str) -> Path | None:
              value = clean_ref(value.strip())
              if not value or value.startswith(("http://", "https://", "//", "data:", "mailto:", "tel:")):
                  return None
              if value.startswith("/"):
                  candidate = public / value.lstrip("/")
              else:
                  candidate = from_file.parent / value
              candidates = [candidate]
              if not candidate.suffix:
                  candidates += [candidate.with_suffix(".js"), candidate.with_suffix(".mjs"), candidate / "index.js"]
              for item in candidates:
                  try:
                      item = item.resolve()
                      item.relative_to(root.resolve())
                  except Exception:
                      continue
                  if item.is_file():
                      return item
              return None

          references: dict[Path, set[Path]] = {}
          missing: list[tuple[str, str]] = []

          def refs_for(path: Path) -> set[Path]:
              if path in references:
                  return references[path]
              found: set[Path] = set()
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  references[path] = found
                  return found

              values: list[str] = []
              suffix = path.suffix.lower()
              if suffix in {".js", ".mjs"}:
                  patterns = [
                      r"\bfrom\s*[\"']([^\"']+)[\"']",
                      r"\bimport\s*[\"']([^\"']+)[\"']",
                      r"\bimport\s*\(\s*[\"'`]([^\"'`]+)[\"'`]\s*\)",
                      r"\brequire\s*\(\s*[\"']([^\"']+)[\"']\s*\)",
                  ]
                  for pattern in patterns:
                      values.extend(re.findall(pattern, text))
                  if path == public / "sw.js":
                      values.extend(re.findall(r"[\"'](/[^\"']+)[\"']", text))
              elif suffix == ".html":
                  values.extend(re.findall(r"(?:src|href)=[\"']([^\"']+)[\"']", text, flags=re.I))
              elif suffix == ".css":
                  values.extend(re.findall(r"url\(\s*[\"']?([^\"')]+)", text, flags=re.I))
              elif suffix in {".json", ".webmanifest"}:
                  try:
                      data = json.loads(text)
                      def walk(value):
                          if isinstance(value, dict):
                              for child in value.values(): walk(child)
                          elif isinstance(value, list):
                              for child in value: walk(child)
                          elif isinstance(value, str) and value.startswith("/"):
                              values.append(value)
                      walk(data)
                  except Exception:
                      pass

              for value in values:
                  target = resolve(path, value)
                  if target:
                      found.add(target)
                  elif value.startswith((".", "/")) and not clean_ref(value).endswith("/"):
                      missing.append((rel(path), value))
              references[path] = found
              return found

          roots: set[Path] = set()
          for html in public.rglob("*.html"):
              roots.add(html)
          for fixed in [public / "sw.js", public / "site.webmanifest"]:
              if fixed.is_file(): roots.add(fixed)
          package = functions / "package.json"
          if package.is_file():
              main = json.loads(package.read_text(encoding="utf-8")).get("main", "index.js")
              target = resolve(package, "./" + main)
              if target: roots.add(target)

          reachable: set[Path] = set()
          queue = deque(sorted(roots))
          while queue:
              current = queue.popleft()
              if current in reachable or not current.is_file():
                  continue
              reachable.add(current)
              for target in sorted(refs_for(current)):
                  if target not in reachable:
                      queue.append(target)

          public_code = {p for p in public.rglob("*") if p.is_file() and p.suffix.lower() in {".js", ".mjs", ".css", ".html"}}
          function_code = {p for p in functions.rglob("*.js") if p.is_file()}
          candidates = sorted(rel(p) for p in (public_code | function_code) - reachable)

          superseded: list[tuple[str, str]] = []
          all_paths = {rel(p): p for p in public_code}
          for candidate in candidates:
              path = Path(candidate)
              stem = path.stem
              for suffix in ("-court", "-game", "-guard", "2"):
                  wrapped = path.with_name(stem + suffix + path.suffix).as_posix()
                  if wrapped in all_paths and all_paths[wrapped] in reachable:
                      superseded.append((candidate, wrapped))

          report = root / "docs" / "REACHABILITY_ANALYSIS.md"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(
              "# Reachability analysis\n\n"
              "Static import/reference traversal from deployed HTML files, the service worker, web manifest, and the Functions package entrypoint.\n\n"
              f"- Roots: **{len(roots)}**\n"
              f"- Reachable code/assets: **{len(reachable)}**\n"
              f"- Unreachable JS/CSS/HTML candidates: **{len(candidates)}**\n"
              f"- Missing local references: **{len(set(missing))}**\n\n"
              "## Roots\n\n" + "\n".join(f"- `{rel(p)}`" for p in sorted(roots)) +
              "\n\n## Unreachable candidates\n\n" + ("\n".join(f"- `{p}`" for p in candidates) or "- None") +
              "\n\n## Likely superseded files\n\n" + (
                  "\n".join(f"- `{old}` → `{new}`" for old, new in superseded) or "- None"
              ) +
              "\n\n## Missing local references\n\n" + (
                  "\n".join(f"- `{source}` → `{value}`" for source, value in sorted(set(missing))) or "- None"
              ) + "\n",
              encoding="utf-8",
          )
          print(report.read_text(encoding="utf-8"))
          PY

      - name: Commit analysis report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REACHABILITY_ANALYSIS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add repository reachability analysis [skip ci]"
          git push origin HEAD:cleanup/community-repository
