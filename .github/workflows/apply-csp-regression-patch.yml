name: Apply CSP regression patch

on:
  push:
    branches: [agent/enforce-script-csp]
    paths:
      - tools/patch-csp-regression-checks.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enforce-script-csp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-csp-regression-checks.mjs
      - run: |
          node --check tools/check-ui-audit.mjs
          node --check tools/check-security-regressions.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check-ui-audit.mjs tools/check-security-regressions.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Update regression checks for enforced script CSP"
          git push origin HEAD:agent/enforce-script-csp
