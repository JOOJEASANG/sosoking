name: Deploy Hosting Only

on:
  workflow_dispatch:

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: firebase-deploy-live
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare brand assets
        run: npm run prepare:icons

      - name: Validate Hosting assets
        run: npm run check

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: ./.github/actions/firebase-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || '' }}
          service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 || '' }}

      - name: Configure App Check client
        env:
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY || '' }}
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK || 'false' }}
        run: node tools/configure-app-check.mjs

      - name: Deploy live Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive

      - name: Hosting summary
        run: echo "Firebase Hosting deployed independently for commit $GITHUB_SHA"
