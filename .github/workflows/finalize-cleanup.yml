name: Finalize repository cleanup

on:
  push:
    branches:
      - cleanup/community-repository

permissions:
  contents: write

concurrency:
  group: finalize-community-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace(path_str, old, new):
              path = root / path_str
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path_str}: {old[:80]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          obsolete = [
              'functions/index.js',
              'public/admin/admin-email-guard.js',
              'public/css/theme-toggle.css',
              'public/js/components/app-install.js',
              'public/js/components/theme-contrast.js',
              'public/js/pages/auth.js',
              'public/js/pwa-init.js',
              'docs/CLEANUP_ANALYSIS.md',
              'docs/REACHABILITY_ANALYSIS.md',
              '.github/workflows/finalize-cleanup.yml',
          ]
          for rel in obsolete:
              path = root / rel
              if path.exists():
                  path.unlink()

          (root / 'functions/main.js').write_text("""'use strict';

