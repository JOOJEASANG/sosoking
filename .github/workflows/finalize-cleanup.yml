          (tools / 'check-project.mjs').write_text(r"""import fs from 'node:fs';
import path from 'node:path';
import { spawnSync } from 'node:child_process';

const root = process.cwd();
const errors = [];
const skipped = new Set(['.git', 'node_modules', '.firebase', 'coverage', 'dist']);

function walk(directory) {
  if (!fs.existsSync(directory)) return [];
  return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
    if (entry.isDirectory() && skipped.has(entry.name)) return [];
    const full = path.join(directory, entry.name);
    return entry.isDirectory() ? walk(full) : entry.isFile() ? [full] : [];
  });
}

function relative(file) {
  return path.relative(root, file).replaceAll(path.sep, '/');
}

function resolveLocal(fromFile, specifier) {
  const clean = specifier.split('?')[0].split('#')[0];
  if (!clean.startsWith('.') && !clean.startsWith('/')) return true;
  const base = clean.startsWith('/')
    ? path.join(root, 'public', clean.slice(1))
    : path.resolve(path.dirname(fromFile), clean);
  return [base, `${base}.js`, `${base}.mjs`, path.join(base, 'index.js')]
    .some(candidate => fs.existsSync(candidate) && fs.statSync(candidate).isFile());
}

const sourceFiles = [
  ...walk(path.join(root, 'functions')).filter(file => file.endsWith('.js')),
  ...walk(path.join(root, 'public')).filter(file => /\.(?:js|mjs)$/.test(file)),
];

for (const file of sourceFiles) {
  const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
  if (result.status !== 0) errors.push(`${relative(file)}: ${result.stderr.trim() || 'syntax error'}`);
  const source = fs.readFileSync(file, 'utf8');
  const patterns = [
    /\bfrom\s*['"]([^'"]+)['"]/g,
    /\bimport\s*['"]([^'"]+)['"]/g,
    /\bimport\s*\(\s*[`'"]([^`'"]+)[`'"]\s*\)/g,
    /\brequire\s*\(\s*['"]([^'"]+)['"]\s*\)/g,
  ];
  for (const pattern of patterns) {
    for (const match of source.matchAll(pattern)) {
      if (!resolveLocal(file, match[1])) errors.push(`${relative(file)}: missing local module ${match[1]}`);
    }
  }
}

for (const htmlFile of walk(path.join(root, 'public')).filter(file => file.endsWith('.html'))) {
  const html = fs.readFileSync(htmlFile, 'utf8');
  for (const match of html.matchAll(/(?:src|href)=["'](\/[^"'#?]+\.(?:js|mjs|css|svg|png|webp|jpg|jpeg|json|webmanifest))["']/g)) {
    const asset = path.join(root, 'public', match[1].slice(1));
    if (!fs.existsSync(asset)) errors.push(`${relative(htmlFile)}: missing asset ${match[1]}`);
  }
}

for (const jsonFile of ['package.json', 'firebase.json', 'firestore.indexes.json', 'functions/package.json', 'functions/package-lock.json', 'public/site.webmanifest', 'public/version.json']) {
  try { JSON.parse(fs.readFileSync(path.join(root, jsonFile), 'utf8')); }
  catch (error) { errors.push(`${jsonFile}: invalid JSON: ${error.message}`); }
}

const forbiddenFiles = [
  'functions/index.js',
  'public/admin/admin-email-guard.js',
  'public/css/theme-toggle.css',
  'public/js/components/app-install.js',
  'public/js/components/theme-contrast.js',
  'public/js/pages/auth.js',
  'public/js/pwa-init.js',
];
for (const file of forbiddenFiles) {
  if (fs.existsSync(path.join(root, file))) errors.push(`${file}: obsolete file remains`);
}

for (const base of ['functions', 'public']) {
  for (const file of walk(path.join(root, base))) {
    if (!/\.(?:js|mjs|html)$/.test(file)) continue;
    const source = fs.readFileSync(file, 'utf8');
    if (source.includes('sosoday1976@gmail.com') || source.includes("['sosoday1976', 'gmail.com']")) {
      errors.push(`${relative(file)}: hard-coded administrator email remains`);
    }
  }
}

const mainPath = path.join(root, 'functions/main.js');
const mainSource = fs.readFileSync(mainPath, 'utf8');
const loadedModules = [...mainSource.matchAll(/require\(['"](\.\/[^'"]+)['"]\)/g)].map(match => match[1]);
const exportOwners = new Map();
for (const specifier of loadedModules) {
  const file = path.resolve(path.dirname(mainPath), `${specifier}.js`);
  if (!fs.existsSync(file)) {
    errors.push(`functions/main.js: missing module ${specifier}`);
    continue;
  }
  const source = fs.readFileSync(file, 'utf8');
  for (const match of source.matchAll(/exports\.([A-Za-z_$][\w$]*)\s*=/g)) {
    const owner = exportOwners.get(match[1]);
    if (owner) errors.push(`duplicate function export ${match[1]}: ${owner}, ${relative(file)}`);
    else exportOwners.set(match[1], relative(file));
  }
}

const deployWorkflow = fs.readFileSync(path.join(root, '.github/workflows/firebase-deploy.yml'), 'utf8');
const deployMatch = deployWorkflow.match(/firebase deploy --only functions:([^\s]+)/);
if (!deployMatch) errors.push('firebase-deploy.yml: deployed Functions list not found');
else {
  for (const name of deployMatch[1].split(',functions:')) {
    if (!exportOwners.has(name)) errors.push(`firebase-deploy.yml: ${name} is not exported by functions/main.js`);
  }
}

if (errors.length) {
  console.error(`\n검사 실패 (${errors.length}건)`);
  errors.forEach(error => console.error(`- ${error}`));
  process.exit(1);
}

console.log(`검사 통과: Functions/Client JS ${sourceFiles.length}개, 배포 함수 ${exportOwners.size}개`);
""", encoding='utf-8')

