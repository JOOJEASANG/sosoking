## 정리 기준

- 업로드된 `sosoking(재미있는 판결사이트).zip`을 기준으로 소스를 복원했습니다.
- `public/index.html`, `public/admin/index.html`, `functions/main.js`, PWA 진입점을 시작으로 정적 참조 관계를 추적했습니다.
- 실제 화면·Functions 엔트리에서 도달하지 못하거나 활성 구현에 의해 대체된 파일만 삭제했습니다.

## 삭제한 코드

- `functions/index.js`: 동일한 `submitCase`, `generateTrial`을 먼저 내보냈다가 뒤 모듈에 덮어써지던 죽은 구현입니다. 특히 여러 번 Gemini를 호출하는 구형 코드였으나 실제 배포 결과에는 사용되지 않았습니다.
- `public/admin/admin-email-guard.js`: `admin.js`의 관리자 검사와 중복되고 HTML에서 로드되지 않았습니다.
- `public/css/theme-toggle.css`: `components/theme.js`가 같은 스타일을 런타임에 주입합니다.
- `public/js/components/app-install.js`, `public/js/pwa-init.js`: 활성 `components/pwa-ui.js`와 중복된 PWA 설치 코드입니다.
- `public/js/components/theme-contrast.js`: 활성 `components/contrast-fix.js`와 중복된 테마 보정 코드입니다.
- `public/js/pages/auth.js`: 현재 라우터가 사용하는 `auth2.js`에 대체된 구형 인증 화면입니다.
- 저장소 루트의 ZIP과 일회성 분석 워크플로도 제거했습니다.

## 보안·구조 개선

- 특정 이메일을 코드에 넣어 관리자 권한을 우회 허용하던 예외를 제거했습니다.
- 관리자 판정은 Firestore의 `admins/{uid}` 또는 `admins/{email}` 문서만 사용합니다.
- Firebase Admin 초기화는 `functions/main.js`에서 명시적으로 한 번 수행합니다.
- 루트 `package.json`과 `tools/check-project.mjs`를 추가해 문법, 로컬 모듈·정적 자산, JSON, 중복 함수 내보내기, 배포 함수 목록을 검사합니다.
- Firebase 배포 워크플로는 `npm ci`를 사용하고 배포 전에 `npm run check`를 실행합니다.

## 유지한 항목

- 법정형 UI를 덧씌우는 `*-court.js`, `*-game.js`, `*-guard.js` 파일은 기본 페이지를 가져와 확장하는 활성 래퍼이므로 유지했습니다.
- `submit-secure.js`와 `generate-trial-lite.js`는 최종적으로 동일 함수명을 내보내는 활성 서버 구현이므로 유지했습니다.
- Firestore 규칙은 관리자 문서 기반 권한, 본인 사건 접근, 공개 판결 접근을 분리하고 있어 그대로 유지했습니다.
