name: Migrate legacy case IDs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a dry scan or apply the migration
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirmation:
        description: Type MIGRATE_LEGACY_CASE_IDS when mode is apply
        required: false
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate migration request
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$MODE" = "apply" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Apply mode is allowed only from main."
              exit 1
            fi
            if [ "$CONFIRMATION" != "MIGRATE_LEGACY_CASE_IDS" ]; then
              echo "Apply mode requires the exact confirmation string."
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: ./.github/actions/firebase-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || '' }}
          service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 || '' }}

      - name: Run migration
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
          MODE: ${{ inputs.mode }}
          CONFIRM_LEGACY_CASE_MIGRATION: ${{ inputs.confirmation }}
        run: node functions/migrate-legacy-case-ids-cli.js --mode="$MODE"
