name: Apply administrator report tab

on:
  push:
    branches: [agent/connect-report-moderation]
    paths:
      - tools/patch-admin-report-tab.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-report-moderation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-admin-report-tab.mjs
      - run: |
          node --check public/admin/admin.js
          node --check public/admin/admin-bootstrap.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin/admin.js public/admin/admin-bootstrap.js
          git diff --cached --quiet && exit 0
          git commit -m "Add administrator report moderation tab"
          git push origin HEAD:agent/connect-report-moderation
