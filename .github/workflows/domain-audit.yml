name: Audit Firebase custom domains

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/domain-audit.yml'
      - 'docs/domain-unification.md'

jobs:
  audit-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google auth client
        run: npm install --no-save --no-package-lock google-auth-library@9

      - name: Inspect Hosting sites and custom domains
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { GoogleAuth } from 'google-auth-library';

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          const auth = new GoogleAuth({
            credentials,
            scopes: ['https://www.googleapis.com/auth/firebase.hosting.readonly']
          });
          const client = await auth.getClient();
          const token = await client.getAccessToken();
          const headers = { Authorization: `Bearer ${token.token || token}` };
          const projectId = 'sosoking-481e6';
          const base = 'https://firebasehosting.googleapis.com/v1beta1';

          async function getJson(url) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
            return text ? JSON.parse(text) : {};
          }

          const sitePayload = await getJson(`${base}/projects/${projectId}/sites?pageSize=100`);
          const sites = [];
          for (const site of sitePayload.sites || []) {
            const siteId = site.name.split('/').at(-1);
            const domainPayload = await getJson(`${base}/projects/${projectId}/sites/${siteId}/customDomains?pageSize=100&showDeleted=true`);
            sites.push({
              siteId,
              defaultUrl: site.defaultUrl || '',
              type: site.type || '',
              customDomains: (domainPayload.customDomains || []).map(domain => ({
                domain: domain.name.split('/').at(-1),
                hostState: domain.hostState || '',
                ownershipState: domain.ownershipState || '',
                redirectTarget: domain.redirectTarget || '',
                certState: domain.cert?.state || '',
                reconciling: domain.reconciling === true,
                deleted: Boolean(domain.deleteTime),
                issues: (domain.issues || []).map(issue => ({ code: issue.code, message: issue.message })),
                desiredDns: (domain.requiredDnsUpdates?.desired || []).flatMap(set =>
                  (set.records || []).map(record => ({
                    domainName: record.domainName,
                    type: record.type,
                    rdata: record.rdata,
                    requiredAction: record.requiredAction
                  }))
                ),
                discoveredDns: (domain.requiredDnsUpdates?.discovered || []).flatMap(set =>
                  (set.records || []).map(record => ({
                    domainName: record.domainName,
                    type: record.type,
                    rdata: record.rdata,
                    requiredAction: record.requiredAction
                  }))
                )
              }))
            });
          }

          console.log('DOMAIN_AUDIT_BEGIN');
          console.log(JSON.stringify({ projectId, sites }, null, 2));
          console.log('DOMAIN_AUDIT_END');
          NODE
