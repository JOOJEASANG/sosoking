name: Unify Firebase custom domains

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/domain-audit.yml'
      - 'docs/domain-unification.md'

jobs:
  unify-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google auth client
        run: npm install --no-save --no-package-lock google-auth-library@9

      - name: Redirect www to the canonical apex domain
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { GoogleAuth } from 'google-auth-library';

          const projectId = 'sosoking-481e6';
          const siteId = 'sosoking-481e6';
          const sourceDomain = 'www.sosoking.co.kr';
          const targetDomain = 'sosoking.co.kr';
          const resourceName = `projects/${projectId}/sites/${siteId}/customDomains/${sourceDomain}`;
          const base = 'https://firebasehosting.googleapis.com/v1beta1';

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          const auth = new GoogleAuth({
            credentials,
            scopes: ['https://www.googleapis.com/auth/firebase.hosting']
          });
          const client = await auth.getClient();
          const token = await client.getAccessToken();
          const headers = {
            Authorization: `Bearer ${token.token || token}`,
            'Content-Type': 'application/json'
          };

          async function requestJson(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const text = await response.text();
            const payload = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
            return payload;
          }

          const domainUrl = `${base}/${resourceName}`;
          const before = await requestJson(domainUrl);
          if (before.hostState !== 'HOST_ACTIVE' || before.ownershipState !== 'OWNERSHIP_ACTIVE') {
            throw new Error(`Domain is not active: host=${before.hostState}, ownership=${before.ownershipState}`);
          }

          if (before.redirectTarget !== targetDomain) {
            const body = JSON.stringify({ name: resourceName, redirectTarget: targetDomain });
            await requestJson(`${domainUrl}?updateMask=redirectTarget&validateOnly=true`, {
              method: 'PATCH',
              body
            });
            const operation = await requestJson(`${domainUrl}?updateMask=redirectTarget`, {
              method: 'PATCH',
              body
            });

            if (operation.name) {
              for (let attempt = 0; attempt < 30; attempt += 1) {
                const current = await requestJson(`${base}/${operation.name}`);
                if (current.done) {
                  if (current.error) throw new Error(`Domain update failed: ${JSON.stringify(current.error)}`);
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
            }
          }

          const after = await requestJson(domainUrl);
          if (after.redirectTarget !== targetDomain) {
            throw new Error(`Redirect target was not saved: ${after.redirectTarget || '(empty)'}`);
          }

          let live = null;
          for (let attempt = 0; attempt < 18; attempt += 1) {
            const checkUrl = `https://${sourceDomain}/guide?domain-unification=${Date.now()}`;
            const response = await fetch(checkUrl, {
              redirect: 'manual',
              headers: { 'Cache-Control': 'no-cache' }
            });
            live = {
              status: response.status,
              location: response.headers.get('location') || ''
            };
            if (live.status === 301 && live.location.startsWith(`https://${targetDomain}/guide`)) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }

          if (live?.status !== 301 || !live.location.startsWith(`https://${targetDomain}/guide`)) {
            throw new Error(`Live redirect not confirmed: ${JSON.stringify(live)}`);
          }

          console.log(JSON.stringify({
            unified: true,
            sourceDomain,
            targetDomain,
            redirectTarget: after.redirectTarget,
            hostState: after.hostState,
            ownershipState: after.ownershipState,
            certState: after.cert?.state || '',
            live
          }, null, 2));
          NODE
