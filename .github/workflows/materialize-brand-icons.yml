name: Materialize brand icons

on:
  push:
    branches:
      - fix/logo-auth-theme-audit

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/logo-auth-theme-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate exact PNG icons
        run: npm run prepare:icons

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/sosoking-192.png public/icons/sosoking-512.png
          if git diff --cached --quiet; then
            echo "Icons are already committed"
            exit 0
          fi
          git commit -m "첨부 원본 로고 PNG 실제 파일 추가"
          git push origin HEAD:fix/logo-auth-theme-audit
