name: Gemini 실제 응답 일회성 검사

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  smoke-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Functions 의존성 설치
        run: npm ci --prefix functions

      - name: Gemini 키·모델·JSON 댓글 응답 검사
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('fs');
          const { GoogleGenerativeAI } = require('./functions/node_modules/@google/generative-ai');
          const key = String(process.env.GEMINI_API_KEY || '').trim();

          async function run() {
            if (!key) throw new Error('GEMINI_API_KEY가 비어 있습니다.');
            const model = new GoogleGenerativeAI(key).getGenerativeModel({
              model: 'gemini-2.5-flash',
              generationConfig: {
                responseMimeType: 'application/json',
                temperature: 0.9,
                topP: 0.95,
                thinkingConfig: { thinkingBudget: 512 },
              },
            });
            const result = await model.generateContent(`다음 상황에 한국 온라인 커뮤니티 회원처럼 똑똑하고 자연스럽고 유쾌한 댓글 한 개를 작성하세요. 억지 유머는 피하세요. 상황: 친구가 약속 시간 10분 전에 세 번째로 취소했습니다. JSON만 출력: {"comments":[{"id":"test","text":"댓글"}]}`);
            const raw = String(result.response.text() || '').trim();
            const data = JSON.parse(raw);
            const text = String(data?.comments?.[0]?.text || '').trim();
            if (text.length < 10) throw new Error('Gemini 댓글 응답이 비어 있거나 너무 짧습니다.');
            return { result: 'success', model: 'gemini-2.5-flash', responseLength: text.length };
          }

          run()
            .then(status => fs.writeFileSync('/tmp/ai-smoke-status.json', JSON.stringify(status, null, 2)))
            .catch(error => {
              fs.writeFileSync('/tmp/ai-smoke-status.json', JSON.stringify({
                result: 'failure',
                model: 'gemini-2.5-flash',
                error: String(error?.message || error).slice(0, 500),
              }, null, 2));
            });
          NODE

      - name: 결과 저장 및 일회성 워크플로 제거
        if: always()
        shell: bash
        run: |
          mkdir -p .github
          cp /tmp/ai-smoke-status.json .github/ai-smoke-status.json
          rm .github/workflows/ai-smoke-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-smoke-status.json .github/workflows/ai-smoke-test-once.yml
          git commit -m "Gemini 실제 응답 검사 결과 기록"
          git pull --rebase origin main
          git push origin HEAD:main
