name: SOSOKING Life Tools · Test & Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sosoking-life-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm run build && node scripts/verify-pwa.mjs && node scripts/verify-seo.mjs --built
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1 @firebase/rules-unit-testing@4
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - if: always()
        run: npm install -g firebase-tools@15.24.0
      - if: always()
        run: firebase emulators:exec --only firestore --project demo-sosoking "node scripts/emulator-check.mjs"
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm run build && node scripts/verify-pwa.mjs && node scripts/verify-seo.mjs --built
      - run: npm install -g firebase-tools@15.24.0
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Deploy locked-down Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project sosoking-481e6 --non-interactive
      - name: Deploy Life Tools site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive
      - name: Verify live site and deployed assets
        run: |
          node --input-type=module <<'NODE'
          import {setTimeout as sleep} from 'node:timers/promises';
          const host = 'https://sosoking-481e6.web.app';
          const checks = [
            ['/', 'id="toolSearch"'],
            ['/sw.js', 'sosoking-life-shell-v4'],
            ['/daily.html', 'id="dailyGrid"'],
            ['/event.html', 'id="eventApp"'],
            ['/old-phone.html', 'id="numberForm"'],
            ['/orders.html', 'id="sharedOrderApp"'],
            ['/ferry.html', 'id="localFerryResults"'],
            ['/info.html', '작은 섬 배시간표'],
            ['/settlement.html', 'id="settleForm"'],
            ['/group-plan.html', 'id="allocationForm"'],
            ['/data/local-ferry.json', 'hongseong-jukdo'],
            ['/data/field-info.json', '마을 교통'],
            ['/community.html', 'id="postList"'],
            ['/shift.html', 'id="shiftForm"'],
            ['/loans.html', '이전 대여 기록'],
            ['/help.html', '개인정보 및 데이터 안내'],
            ['/my.html', 'id="myEvents"'],
            ['/sitemap.xml', '<loc>https://sosoking-481e6.web.app/</loc>'],
            ['/js/life.js', 'lifePolls'],
            ['/css/life.css', '--green:']
          ];
          let remaining = checks;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const results = await Promise.all(remaining.map(async ([path, marker]) => {
              try {
                const url = new URL(path, host);
                url.searchParams.set('_deploy_verify', process.env.GITHUB_SHA + '-' + attempt);
                const res = await fetch(url, {headers: {'cache-control': 'no-cache'}, signal: AbortSignal.timeout(15000)});
                const body = await res.text();
                const ok = res.status === 200 && body.includes(marker);
                console.log((ok ? 'PASS' : 'RETRY') + ' ' + path + ' HTTP ' + res.status + (ok ? '' : ' expected content missing or unavailable'));
                return ok ? null : [path, marker];
              } catch (err) {
                console.log('RETRY ' + path + ': ' + err.message);
                return [path, marker];
              }
            }));
            remaining = results.filter(Boolean);
            if (!remaining.length) {
              console.log('All deployed pages and assets verified.');
              break;
            }
            if (attempt < 12) await sleep(5000);
          }
          if (remaining.length) throw Error('Live verification failed for: ' + remaining.map(([path]) => path).join(', '));
          NODE
      - name: Verify shared item protections with synthetic data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/smoke-daily.mjs
      - name: Cleanup credentials
        if: always()
        run: rm -f '${{ runner.temp }}/firebase-service-account.json'
