name: Deploy Sosoking Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sosoking-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install --no-audit --no-fund

      - name: Install function dependencies
        run: npm install --prefix functions --omit=dev --no-audit --no-fund

      - name: Validate website and functions
        run: |
          npm run check
          node tools/check-site.mjs
          npm run build
          test -f dist/index.html

      - name: Set up Firebase CLI
        run: npm install -g firebase-tools@15.24.0 --no-audit --no-fund

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase deployment credentials are missing" >&2
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy shared event API
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions:sosokingEventApi --project sosoking-481e6 --non-interactive

      - name: Deploy website
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive

      - name: Smoke test live events
        run: node tools/smoke-live.mjs

      - name: Deployment summary
        run: echo "Sosoking Live hosting and event API deployed and smoke-tested for $GITHUB_SHA"
