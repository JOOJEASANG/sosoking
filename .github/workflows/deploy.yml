name: SOSOKING AI VIDEO · Test & Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '43 18 * * *'
permissions:
  contents: read
concurrency:
  group: sosoking-flix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/flix.test.mjs scripts/flix-catalog-review.test.mjs scripts/flix-link-lookup.test.mjs scripts/flix-rules-guard.test.mjs scripts/flix-track-series.test.mjs scripts/flix-seo.test.mjs scripts/flix-stats-core.test.mjs && npm run build
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1 @firebase/rules-unit-testing@4.0.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/flix-smoke.mjs && node scripts/flix-admin-smoke.mjs && node scripts/flix-online-admin-smoke.mjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npx --yes firebase-tools@15.24.0 emulators:exec --project demo-sosoking --only firestore 'node --test scripts/flix-admin-rules.test.mjs'
  auto_merge:
    name: Auto-merge tested owner feature PR
    needs: [check]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'feature/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge exact tested revision and dispatch main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .draft <<<"$pr")" = false
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .head.repo.full_name <<<"$pr")" = "$REPO"
          test "$(jq -r .user.login <<<"$pr")" = "${REPO%%/*}"
          actual_base="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$actual_base" != "$EXPECTED_BASE" ]; then
            echo "::error::Main changed after this PR was tested; retest on the latest main before merging."
            exit 1
          fi
          merged="$(gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f sha="$EXPECTED_HEAD" -f merge_method=merge)"
          test "$(jq -r .merged <<<"$merged")" = true
          echo "Merged commit: $(jq -r .sha <<<"$merged")"
          # A GITHUB_TOKEN merge does not trigger push workflows. Dispatch explicitly.
          gh workflow run deploy.yml --repo "$REPO" --ref main
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund firebase-admin@13
      - run: npm install -g firebase-tools@15.24.0
      - name: Deploy hosting only (preserve Firestore data and rules)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node scripts/flix-seo-snapshot.mjs "$RUNNER_TEMP/flix-seo-catalog.json"
          FLIX_SEO_CATALOG="$RUNNER_TEMP/flix-seo-catalog.json" npm run build
          rm -f "$RUNNER_TEMP/flix-seo-catalog.json"
          firebase deploy --only hosting --project sosoking-481e6 --non-interactive
      - name: Verify live root
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://sosoking-481e6.web.app/?verify=$GITHUB_SHA-$i" | grep -q 'flix.js?v=stats12' && curl -fsS "https://sosoking-481e6.web.app/admin/?verify=$GITHUB_SHA-$i" | grep -q 'id="authPanel"' && curl -fsS "https://sosoking-481e6.web.app/sitemap.xml?verify=$GITHUB_SHA-$i" | grep -q '/works/'; then exit 0; fi
            sleep 5
          done
          exit 1

  admin_rules:
    name: Apply narrowly scoped admin rules only after live-baseline verification
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare active rules and apply only the new admin paths
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS" "$RUNNER_TEMP/flix-active-rules.json"' EXIT
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          echo "::add-mask::$token"
          api="https://firebaserules.googleapis.com/v1"
          release="$(curl -fsS -H "Authorization: Bearer $token" "$api/projects/sosoking-481e6/releases/cloud.firestore")"
          ruleset="$(jq -er .rulesetName <<< "$release")"
          [[ "$ruleset" == projects/sosoking-481e6/rulesets/* ]]
          curl -fsS -H "Authorization: Bearer $token" "$api/$ruleset" > "$RUNNER_TEMP/flix-active-rules.json"
          decision="$(node scripts/flix-rules-guard.mjs "$RUNNER_TEMP/flix-active-rules.json")"
          if [ "$decision" = unchanged ]; then echo 'Admin rules already applied'; exit 0; fi
          test "$decision" = apply
          npx --yes firebase-tools@15.24.0 deploy --only firestore:rules --project sosoking-481e6 --non-interactive

  catalog_seed:
    name: Merge curated initial expansion without overwriting admin edits
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [admin_rules]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund && npm install --no-save --package-lock=false --no-audit --no-fund firebase-admin@13
      - name: Merge only new works once
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/flix-seed.json
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node scripts/flix-seed-import.mjs
