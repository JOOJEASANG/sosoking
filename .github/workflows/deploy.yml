name: Deploy Reset Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sosoking-clean-site
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0 --no-audit --no-fund

      - name: Validate reset page
        run: |
          node --check public/reset.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('public/index.html','utf8'); if(!h.includes('새로운 사이트를')) process.exit(1); JSON.parse(fs.readFileSync('firebase.json'));"

      - name: Prepare Firebase credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Firebase deployment credentials are missing" >&2
            exit 1
          fi
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy blank site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive
