name: SOSOKING Tools · Test & Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sosoking-tools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm run build && node scripts/verify-pwa.mjs && node scripts/verify-seo.mjs --built
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm run build && node scripts/verify-pwa.mjs && node scripts/verify-seo.mjs --built
      - run: npm install -g firebase-tools@15.24.0
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Deploy Firestore security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project sosoking-481e6 --non-interactive
      - name: Deploy site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive
      - name: Verify public programs
        run: |
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/ | grep -q 'SOSOKING'
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/event.html | grep -q '행사 참가자 취합기'
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/old-phone.html | grep -q '옛 휴대폰 번호 변환'
      - name: Verify search crawler access
        run: |
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/robots.txt | grep -q 'Sitemap: https://sosoking-481e6.web.app/sitemap.xml'
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/sitemap.xml | grep -q '<loc>https://sosoking-481e6.web.app/event.html</loc>'
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/event.html | grep -q 'rel="canonical"'
      - name: Verify Firebase app config and anonymous access
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://sosoking-481e6.web.app/__/firebase/init.json');
          if(!response.ok)throw Error('Firebase web configuration endpoint not available: HTTP '+response.status);
          const config=await response.json();
          if(!config.apiKey||config.projectId!=='sosoking-481e6')throw Error('Firebase web app API configuration invalid');
          const auth=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+encodeURIComponent(config.apiKey),{
            method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})
          });
          if(!auth.ok){const error=await auth.json();throw Error('Firebase anonymous auth unavailable: '+String(error?.error?.message||auth.status));}
          const user=await auth.json();
          if(!user.localId||!user.idToken)throw Error('Anonymous auth returned missing identity');
          console.log('Firebase anonymous sign-in works; account details not logged');
          NODE
      - name: Live Firestore permission test (synthetic data only)
        run: node scripts/smoke-firebase.mjs
      - name: Cleanup credentials
        if: always()
        run: rm -f '${{ runner.temp }}/firebase-service-account.json'
