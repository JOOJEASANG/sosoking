name: SOSOKING Life Tools · Test & Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sosoking-life-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm run build && node scripts/verify-pwa.mjs && node scripts/verify-seo.mjs --built
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm run build && node scripts/verify-pwa.mjs && node scripts/verify-seo.mjs --built
      - run: npm install -g firebase-tools@15.24.0
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Deploy locked-down Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project sosoking-481e6 --non-interactive
      - name: Deploy Life Tools site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive
      - name: Verify live application and retired programs
        run: |
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/ | grep -q '소소하지만'
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/sw.js | grep -q 'sosoking-life-shell-v1'
          for page in daily.html event.html old-phone.html orders.html ferry.html community.html shift.html loans.html my.html; do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' "https://sosoking-481e6.web.app/$page")
            test "$status" = 200
          done
          curl --fail --retry 4 --retry-delay 3 -sSL https://sosoking-481e6.web.app/sitemap.xml | grep -q '<loc>https://sosoking-481e6.web.app/</loc>'
      - name: Verify shared item protections with synthetic data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/smoke-daily.mjs
      - name: Cleanup credentials
        if: always()
        run: rm -f '${{ runner.temp }}/firebase-service-account.json'
