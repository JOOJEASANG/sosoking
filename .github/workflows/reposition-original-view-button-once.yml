name: Reposition Original View Button Once

on:
  push:
    branches:
      - agent/reposition-original-view-button

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/reposition-original-view-button
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Reposition original view button and refresh caches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const OLD_APP_VERSION = '20260802-remove-daily-court-2';
          const NEW_VERSION = '20260802-original-button-layout-1';
          const OLD_RESULT_VERSION = '20260801-public-original-modal-1';

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:js|mjs|html|css|json|yml|yaml|md)$/.test(entry.name)) {
                let source = fs.readFileSync(full, 'utf8');
                const updated = source
                  .split(OLD_APP_VERSION).join(NEW_VERSION)
                  .split(OLD_RESULT_VERSION).join(NEW_VERSION);
                if (updated !== source) fs.writeFileSync(full, updated);
              }
            }
          }

          function replaceRequired(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`Patch target missing: ${label}`);
            return source.replace(before, after);
          }

          walk('.');

          const resultPath = 'public/js/pages/result-comments.js';
          let result = fs.readFileSync(resultPath, 'utf8');

          result = replaceRequired(result,
`    .result-original-trigger{
      margin-left:auto;border:1px solid var(--border);border-radius:999px;
      background:rgba(201,168,76,.12);color:var(--gold);padding:8px 13px;
      font:inherit;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap;
    }
    .result-original-trigger:hover{background:rgba(201,168,76,.2);border-color:var(--gold);}`,
`    .result-original-actions{
      display:flex;align-items:center;justify-content:center;margin:15px 0 0;
    }
    .result-original-trigger{
      display:inline-flex;align-items:center;justify-content:center;min-height:38px;margin:0;
      border:1px solid #d5c5a9;border-radius:999px;background:#f7f0e3;color:#654b24;
      padding:9px 15px;font:inherit;font-size:12px;font-weight:900;cursor:pointer;
      white-space:nowrap;box-shadow:0 5px 14px rgba(89,66,32,.1);
    }
    .result-original-trigger:hover{background:#efe2ca;border-color:#a97927;color:#4c3517;}
    [data-theme='dark'] .result-original-trigger{
      border-color:rgba(209,173,80,.34);background:rgba(201,168,76,.12);color:var(--gold);
      box-shadow:0 5px 16px rgba(0,0,0,.18);
    }
    [data-theme='dark'] .result-original-trigger:hover{
      background:rgba(201,168,76,.2);border-color:var(--gold);color:var(--gold);
    }`,
          'original trigger styles');

          result = replaceRequired(result,
`      .result-original-trigger{padding:7px 11px;font-size:11px;}`,
`      .result-original-actions{margin-top:13px;}
      .result-original-trigger{width:min(100%,240px);padding:10px 14px;font-size:12px;}`,
          'mobile original trigger styles');

          result = replaceRequired(result,
`  const header = container.querySelector('.result-document-page > .page-header');
  const page = container.querySelector('.result-document-page');
  if (!header || !page || header.querySelector('[data-original-trigger]')) return;`,
`  const page = container.querySelector('.result-document-page');
  const cover = page?.querySelector('.result-cover');
  const judgeSummary = cover?.querySelector('.judge-summary');
  if (!page || !cover || !judgeSummary || page.querySelector('[data-original-trigger]')) return;`,
          'original trigger mount target');

          result = replaceRequired(result,
`  trigger.textContent = '📄 원문보기';
  trigger.setAttribute('aria-haspopup', 'dialog');

  const layer = document.createElement('div');`,
`  trigger.textContent = '📄 원문보기';
  trigger.setAttribute('aria-haspopup', 'dialog');
  trigger.setAttribute('aria-label', '사용자가 접수한 원문 보기');

  const actions = document.createElement('div');
  actions.className = 'result-original-actions';
  actions.dataset.originalActions = 'true';
  actions.appendChild(trigger);

  const layer = document.createElement('div');`,
          'original trigger action row');

          result = replaceRequired(result,
`  header.appendChild(trigger);
  page.appendChild(layer);`,
`  judgeSummary.insertAdjacentElement('beforebegin', actions);
  page.appendChild(layer);`,
          'original trigger insertion');

          fs.writeFileSync(resultPath, result);

          const checkPath = 'tools/check-public-original-modal.mjs';
          let check = fs.readFileSync(checkPath, 'utf8');
          check = replaceRequired(check,
`  "trigger.textContent = '📄 원문보기';",
  "layer.setAttribute('role', 'dialog');",`,
`  "trigger.textContent = '📄 원문보기';",
  "actions.className = 'result-original-actions';",
  "judgeSummary.insertAdjacentElement('beforebegin', actions);",
  "layer.setAttribute('role', 'dialog');",`,
          'public original layout regression requirements');
          check = replaceRequired(check,
`const version = '${NEW_VERSION}';`,
`assert.ok(!resultPage.includes('header.appendChild(trigger)'), '원문보기 버튼이 테마 토글과 겹치는 상단 헤더에 다시 배치되면 안 됩니다.');

const version = '${NEW_VERSION}';`,
          'public original overlap regression');
          fs.writeFileSync(checkPath, check);

          console.log('Original view button moved into the verdict cover and cache versions refreshed.');
          NODE

      - name: Validate entire repository
        run: npm test

      - name: Commit validated change
        run: |
          rm .github/workflows/reposition-original-view-button-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/sw.js public/js/app.js public/js/pages/result-comments.js tools .github/workflows/reposition-original-view-button-once.yml
          git commit -m "판결기록 원문보기 버튼 재배치"
          git push origin HEAD:agent/reposition-original-view-button
