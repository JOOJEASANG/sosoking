name: Regenerate centered PWA icon

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/prepare-brand-icons.mjs'
      - 'assets/brand/unified-logo.webp.b64'
      - '.github/workflows/regenerate-centered-pwa-icon.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate icons
        run: npm run prepare:icons

      - name: Commit generated maskable icon
        shell: bash
        run: |
          if git diff --quiet -- public/icons/sosoking-maskable-512.png; then
            echo "Centered maskable icon is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/sosoking-maskable-512.png
          git commit -m "Regenerate centered PWA app icon"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
