name: Apply administrator consolidation checks

on:
  push:
    branches: [agent/consolidate-admin-module]
    paths:
      - tools/patch-admin-consolidation-checks.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-admin-module
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-admin-consolidation-checks.mjs
      - run: |
          node --check tools/check-project.mjs
          node --check tools/check-security-regressions.mjs
          node --check tools/check-script-csp.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check-project.mjs tools/check-security-regressions.mjs tools/check-script-csp.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Update checks for consolidated administrator module"
          git push origin HEAD:agent/consolidate-admin-module
