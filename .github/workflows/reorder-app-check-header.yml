name: Reorder App Check header

on:
  push:
    branches: [agent/app-check-deploy-config]
    paths:
      - tools/reorder-app-check-header.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-check-deploy-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/reorder-app-check-header.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase.json
          git diff --cached --quiet && exit 0
          git commit -m "Prioritize App Check config cache headers"
          git push origin HEAD:agent/app-check-deploy-config
