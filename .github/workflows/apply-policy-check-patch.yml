name: Apply policy check patch

on:
  push:
    branches: [agent/legacy-id-migration-policy]
    paths:
      - tools/patch-policy-check.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-id-migration-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-policy-check.mjs
      - run: node --check tools/check-security-regressions.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check-security-regressions.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Refine policy regression detection"
          git push origin HEAD:agent/legacy-id-migration-policy
