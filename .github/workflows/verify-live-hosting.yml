name: Verify Live Hosting

on:
  workflow_run:
    workflows: ["Deploy Firebase", "Deploy Hosting Only"]
    types: [completed]

jobs:
  verify-live-hosting:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require deployment success
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "Production deployment did not succeed: $DEPLOY_CONCLUSION"
            exit 1
          fi

      - name: Checkout deployed revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify all production hosts serve the same release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(tr -d '\r\n' < public/deploy-version.txt)"
          if [ -z "$EXPECTED_VERSION" ]; then
            echo "public/deploy-version.txt is empty"
            exit 1
          fi

          hosts=(
            "https://sosoking-481e6.web.app"
            "https://sosoking.co.kr"
            "https://www.sosoking.co.kr"
          )

          for host in "${hosts[@]}"; do
            echo "Checking $host"
            marker="$(curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "$host/deploy-version.txt?sha=$HEAD_SHA")"
            if [ "$marker" != "$EXPECTED_VERSION" ]; then
              echo "Release mismatch on $host: expected '$EXPECTED_VERSION', got '$marker'"
              exit 1
            fi

            html="$(curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "$host/?sha=$HEAD_SHA")"
            if ! grep -Fq "<meta name=\"sosoking-deploy-version\" content=\"$EXPECTED_VERSION\">" <<< "$html"; then
              echo "HTML deployment marker missing on $host"
              exit 1
            fi
          done

          echo "All production hosts serve $EXPECTED_VERSION"
