name: Verify Live Hosting

on:
  workflow_run:
    workflows: ["Deploy Sosoking"]
    types: [completed]

jobs:
  verify-live-hosting:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require deployment success
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "Deployment did not succeed: $DEPLOY_CONCLUSION"
            exit 1
          fi

      - name: Verify production hosts
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          hosts=(
            "https://sosoking-481e6.web.app"
            "https://sosoking.co.kr"
            "https://www.sosoking.co.kr"
          )

          for host in "${hosts[@]}"; do
            html="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' "$host/?sha=$HEAD_SHA")"
            if ! grep -Fq '<html lang="ko"' <<< "$html"; then
              echo "Unexpected document served by $host"
              exit 1
            fi
            echo "$host is live"
          done
