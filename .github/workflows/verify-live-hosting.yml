name: Verify Live Hosting

on:
  workflow_run:
    workflows: ["Deploy Sosoking Play"]
    types: [completed]

jobs:
  verify-live-hosting:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require deployment success
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "Deployment did not succeed: $DEPLOY_CONCLUSION"
            exit 1
          fi

      - name: Verify production hosts
        env:
          EXPECTED_VERSION: sosoking-play-20260817-3
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          hosts=(
            "https://sosoking-481e6.web.app"
            "https://sosoking.co.kr"
            "https://www.sosoking.co.kr"
          )

          for host in "${hosts[@]}"; do
            marker="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' "$host/deploy-version.txt?sha=$HEAD_SHA")"
            if [ "$marker" != "$EXPECTED_VERSION" ]; then
              echo "Release mismatch on $host: expected '$EXPECTED_VERSION', got '$marker'"
              exit 1
            fi

            html="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' "$host/?sha=$HEAD_SHA")"
            if ! grep -Fq "<meta name=\"sosoking-deploy-version\" content=\"$EXPECTED_VERSION\">" <<< "$html"; then
              echo "HTML deployment marker missing on $host"
              exit 1
            fi

            naming_html="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' "$host/game/naming/?sha=$HEAD_SHA")"
            if ! grep -Fq "<title>작명톡 생존전 | 소소킹 플레이</title>" <<< "$naming_html"; then
              echo "Naming game route is missing on $host"
              exit 1
            fi

            alibi_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$host/game/alibi/?sha=$HEAD_SHA")"
            if [ "$alibi_status" != "404" ]; then
              echo "Retired Alibi route still responds on $host: HTTP $alibi_status"
              exit 1
            fi
          done

          echo "All production hosts serve $EXPECTED_VERSION with Naming live and Alibi removed"
