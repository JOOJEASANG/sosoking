name: Validate Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Verify removed technical references
        run: |
          if grep -RInE 'daily-real-court|daily_court_|#/daily-court|/daily-court|getDailyRealCourt|submitDailyRealCourtVerdict|LAW_OPEN_API_OC' \
            --exclude-dir=.git --exclude='package-lock.json' .; then
            echo 'Removed daily-court technical references remain.'
            exit 1
          fi

      - name: Run complete validation
        run: npm test
