name: Patch Google Login Message

on:
  push:
    branches:
      - agent/google-login-message-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-login-message-fix
          fetch-depth: 0

      - name: Apply focused login-message fix
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260731-google-login-message-1'

          auth_path = Path('public/js/pages/auth2.js')
          auth = auth_path.read_text(encoding='utf-8')

          marker = "function popupNeedsRedirect(e){ return ['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e?.code); }"
          helper = marker + "\nfunction currentSignedInUser(){ const user = auth.currentUser; return user && !user.isAnonymous ? user : null; }"
          if 'function currentSignedInUser()' not in auth:
              if marker not in auth:
                  raise SystemExit('popup redirect marker not found')
              auth = auth.replace(marker, helper, 1)

          old_redirect = """  }).catch(error => {
    console.warn('redirect login result skipped', error?.code || error);
    if(consumeRedirectFlag()) showAuthNotice(friendlyAuthMessage(error), 'error');
  });"""
          new_redirect = """  }).catch(async error => {
    console.warn('redirect login result skipped', error?.code || error);
    if(!consumeRedirectFlag()) return;
    await auth.authStateReady().catch(() => {});
    const signedInUser = currentSignedInUser();
    if(signedInUser){
      showAuthNotice('Google 로그인 완료', 'success');
      await renderUser(signedInUser).catch(renderError => console.warn('redirect login view render skipped', renderError));
      return;
    }
    showAuthNotice(friendlyAuthMessage(error), 'error');
  });"""
          if old_redirect not in auth:
              raise SystemExit('redirect catch block not found')
          auth = auth.replace(old_redirect, new_redirect, 1)

          old_popup = """    try {
      const result = await signInWithPopup(auth, googleProvider);
      showAuthNotice('Google 로그인 완료', 'success');
      const profile = await profileOf(result.user);
      profile.nickname ? drawProfile(box, result.user, profile) : drawNick(box, result.user, profile);
    } catch(error){
      console.warn('google login failed', error?.code || error);
      if(popupNeedsRedirect(error)) {
        if(!markRedirectStarted()) {
          showAuthNotice(friendlyAuthMessage({ code: 'auth/web-storage-unsupported' }), 'error');
          btn.disabled = false;
          btn.textContent = 'Google로 계속하기';
          return;
        }
        btn.textContent = 'Google 로그인 화면으로 이동...';
        try { await signInWithRedirect(auth, googleProvider); return; }
        catch(redirectError) { consumeRedirectFlag(); error = redirectError; }
      }
      showAuthNotice(friendlyAuthMessage(error, 'Google 로그인에 실패했습니다.'), 'error');
      btn.disabled = false;
      btn.textContent = 'Google로 계속하기';
    }"""
          new_popup = """    let result = null;
    try {
      result = await signInWithPopup(auth, googleProvider);
    } catch(error){
      console.warn('google login attempt reported an error', error?.code || error);
      if(popupNeedsRedirect(error)) {
        if(!markRedirectStarted()) {
          showAuthNotice(friendlyAuthMessage({ code: 'auth/web-storage-unsupported' }), 'error');
          btn.disabled = false;
          btn.textContent = 'Google로 계속하기';
          return;
        }
        btn.textContent = 'Google 로그인 화면으로 이동...';
        try { await signInWithRedirect(auth, googleProvider); return; }
        catch(redirectError) { consumeRedirectFlag(); error = redirectError; }
      }
      await auth.authStateReady().catch(() => {});
      const signedInUser = currentSignedInUser();
      if(signedInUser){
        result = { user: signedInUser };
        console.warn('google login error ignored because authenticated state is active', error?.code || error);
      } else {
        showAuthNotice(friendlyAuthMessage(error, 'Google 로그인에 실패했습니다.'), 'error');
        btn.disabled = false;
        btn.textContent = 'Google로 계속하기';
        return;
      }
    }

    showAuthNotice('Google 로그인 완료', 'success');
    try {
      const profile = await profileOf(result.user);
      profile.nickname ? drawProfile(box, result.user, profile) : drawNick(box, result.user, profile);
    } catch(error){
      console.warn('google login profile render skipped', error?.code || error);
    }"""
          if old_popup not in auth:
              raise SystemExit('popup login block not found')
          auth = auth.replace(old_popup, new_popup, 1)
          auth_path.write_text(auth, encoding='utf-8')

          app_path = Path('public/js/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_auth_import = "import { renderAuth } from './pages/auth2.js?v=20260729-brand-unified-1';"
          new_auth_import = f"import {{ renderAuth }} from './pages/auth2.js?v={version}';\n// Cache lineage marker: './pages/auth2.js?v=20260729-brand-unified-1';"
          if old_auth_import not in app:
              raise SystemExit('active auth import not found')
          app = app.replace(old_auth_import, new_auth_import, 1)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('public/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_app_version = '20260730-final-audit-1'
          index = index.replace(
              f'<script type="module" src="/js/app.js?v={old_app_version}"></script>',
              f'<script type="module" src="/js/app.js?v={version}"></script>\n  <!-- Cache lineage: /js/app.js?v={old_app_version} -->',
              1
          )
          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('public/sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace(
              "const CACHE_NAME = 'sosoking-app-v20260730-final-audit-1';",
              f"const CACHE_NAME = 'sosoking-app-v{version}';\n// Cache lineage: const CACHE_NAME = 'sosoking-app-v20260730-final-audit-1';",
              1
          )
          sw = sw.replace(
              "'/js/app.js?v=20260730-final-audit-1',",
              f"'/js/app.js?v={version}',\n  '/js/app.js?v=20260730-final-audit-1',",
              1
          )
          auth_cache = f"  '/js/pages/auth2.js?v={version}',\n"
          anchor = "  '/js/pages/my-cases-game.js?v=20260729-dark-record-participation-1',\n"
          if auth_cache.strip() not in sw:
              if anchor not in sw:
                  raise SystemExit('service worker auth cache anchor not found')
              sw = sw.replace(anchor, anchor + auth_cache, 1)
          sw_path.write_text(sw, encoding='utf-8')

          test_path = Path('tools/check-google-login-message.mjs')
          test_path.write_text(f"""import fs from 'node:fs';

const errors = [];
const read = file => fs.readFileSync(file, 'utf8');
const need = (source, value, label) => {{
  if (!source.includes(value)) errors.push(`${{label}}: missing ${{value}}`);
}};

const auth = read('public/js/pages/auth2.js');
for (const value of [
  'function currentSignedInUser()',
  'await auth.authStateReady().catch(() => {{}})',
  'google login error ignored because authenticated state is active',
  'google login profile render skipped',
  "showAuthNotice('Google 로그인 완료', 'success')",
  "showAuthNotice(friendlyAuthMessage(error, 'Google 로그인에 실패했습니다.'), 'error')"
]) need(auth, value, 'Google login state guard');

const popupStart = auth.indexOf("document.getElementById('google-login').onclick");
const popupEnd = auth.indexOf("document.getElementById('email-form').onsubmit", popupStart);
const popup = popupStart >= 0 && popupEnd > popupStart ? auth.slice(popupStart, popupEnd) : '';
if (!popup) errors.push('Google login handler: unable to isolate handler');
const stateGuard = popup.indexOf('const signedInUser = currentSignedInUser()');
const failureNotice = popup.indexOf("showAuthNotice(friendlyAuthMessage(error, 'Google 로그인에 실패했습니다.'), 'error')");
if (stateGuard < 0 || failureNotice < 0 || stateGuard > failureNotice) {
  errors.push('Google login handler: failure notice can run before authenticated-state recovery');
}
const successNotice = popup.lastIndexOf("showAuthNotice('Google 로그인 완료', 'success')");
const profileRenderCatch = popup.indexOf("console.warn('google login profile render skipped'");
if (successNotice < 0 || profileRenderCatch < successNotice) {
  errors.push('Google login handler: post-login profile rendering is not isolated from authentication success');
}

const app = read('public/js/app.js');
const index = read('public/index.html');
const worker = read('public/sw.js');
need(app, "./pages/auth2.js?v={version}", 'active auth module');
need(index, "/js/app.js?v={version}", 'active application');
need(worker, "const CACHE_NAME = 'sosoking-app-v{version}';", 'active cache');
need(worker, "/js/app.js?v={version}", 'cached application');
need(worker, "/js/pages/auth2.js?v={version}", 'cached auth module');

if (errors.length) {{
  console.error(`Google login message validation failed (${{errors.length}})`);
  errors.forEach(error => console.error(`- ${{error}}`));
  process.exit(1);
}}

console.log('Google login message validation passed: authenticated state overrides stale popup errors, post-login rendering cannot report authentication failure, and active cache versions are synchronized.');
""", encoding='utf-8')

          package_path = Path('package.json')
          package = package_path.read_text(encoding='utf-8')
          anchor = 'node tools/check-admin-login-routing.mjs && '
          addition = 'node tools/check-google-login-message.mjs && '
          if addition not in package:
              if anchor not in package:
                  raise SystemExit('package validation anchor not found')
              package = package.replace(anchor, anchor + addition, 1)
          package_path.write_text(package, encoding='utf-8')

          Path('.github/workflows/patch-google-login-message.yml').unlink()
          PY

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix false Google login failure message"
          git push origin HEAD:agent/google-login-message-fix
