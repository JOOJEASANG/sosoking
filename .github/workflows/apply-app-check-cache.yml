name: Apply App Check cache patch

on:
  push:
    branches: [agent/app-check-deploy-config]
    paths:
      - tools/patch-app-check-cache.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-check-deploy-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-app-check-cache.mjs
      - run: |
          node --check public/sw.js
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase.json public/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep App Check configuration fresh"
          git push origin HEAD:agent/app-check-deploy-config
