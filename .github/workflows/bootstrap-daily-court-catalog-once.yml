name: Bootstrap Daily Court Catalog Once

on:
  push:
    branches:
      - ops/bootstrap-daily-court-1000-20260802
    paths-ignore:
      - ops/daily-court-bootstrap-status.json
      - ops/law-api-diagnostic.json

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: daily-court-catalog-bootstrap
      cancel-in-progress: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Verify registered secrets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
          LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          if [ -z "$LAW_OPEN_API_OC" ]; then
            echo "Missing GitHub secret: LAW_OPEN_API_OC"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "Required secrets are registered."

      - name: Diagnose law API response
        env:
          LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const oc = String(process.env.LAW_OPEN_API_OC || '').trim();
            const tests = [
              { name: 'plain', params: { target: 'prec', type: 'JSON', display: '3', page: '1' } },
              { name: 'dated', params: { target: 'prec', type: 'JSON', display: '3', page: '1', sort: 'ddes', prncYd: '20200101~20260802' } }
            ];
            const results = [];
            for (const test of tests) {
              const url = new URL('https://www.law.go.kr/DRF/lawSearch.do');
              url.search = new URLSearchParams({ OC: oc, ...test.params }).toString();
              const response = await fetch(url, { headers: { accept: 'application/json,text/plain,*/*', 'user-agent': 'sosoking-daily-court-diagnostic/1.0' } });
              const raw = await response.text();
              const sanitized = raw.split(oc).join('[REDACTED]');
              let parsed = null;
              try { parsed = JSON.parse(raw.replace(/^\uFEFF/, '')); } catch {}
              const payload = parsed?.PrecSearch || parsed?.precSearch || parsed || {};
              results.push({
                name: test.name,
                httpStatus: response.status,
                contentType: response.headers.get('content-type') || '',
                bodyLength: raw.length,
                topLevelKeys: parsed && typeof parsed === 'object' ? Object.keys(parsed).slice(0, 20) : [],
                payloadKeys: payload && typeof payload === 'object' ? Object.keys(payload).slice(0, 30) : [],
                totalCnt: payload?.totalCnt ?? payload?.totalCount ?? null,
                itemCount: Array.isArray(payload?.prec) ? payload.prec.length : Array.isArray(payload?.items) ? payload.items.length : null,
                preview: sanitized.slice(0, 800)
              });
            }
            fs.writeFileSync('/tmp/law-api-diagnostic.json', JSON.stringify({ checkedAt: new Date().toISOString(), results }, null, 2) + '\n');
            console.log(JSON.stringify(results.map(({ name, httpStatus, contentType, totalCnt, itemCount, topLevelKeys, payloadKeys }) => ({ name, httpStatus, contentType, totalCnt, itemCount, topLevelKeys, payloadKeys }))));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Preserve current verified cases
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node tools/sync-daily-real-court-catalog.mjs

      - name: Import 1000 official court cases
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
          LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
          DAILY_COURT_TARGET_SIZE: '1000'
        run: node tools/bootstrap-daily-real-court-1000.mjs

      - name: Verify 1000 unique stored cases
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
          DAILY_COURT_TARGET_SIZE: '1000'
          DAILY_COURT_REQUIRE_TARGET: 'true'
        run: node tools/write-daily-court-catalog-status.mjs

      - name: Deploy verified catalog status to Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive

      - name: Record execution status
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          STATUS_BRANCH: ops/bootstrap-daily-court-1000-20260802
        run: |
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p ops
          cat > ops/daily-court-bootstrap-status.json <<EOF
          {
            "status": "$RUN_STATUS",
            "runId": "$RUN_ID",
            "sourceSha": "$RUN_SHA",
            "targetCount": 1000,
            "firebaseProject": "sosoking-481e6",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          if [ -f /tmp/law-api-diagnostic.json ]; then
            cp /tmp/law-api-diagnostic.json ops/law-api-diagnostic.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/daily-court-bootstrap-status.json ops/law-api-diagnostic.json 2>/dev/null || git add ops/daily-court-bootstrap-status.json
          git commit -m "Record daily court bootstrap diagnostics: $RUN_STATUS" || exit 0
          git push origin "$STATUS_BRANCH"
