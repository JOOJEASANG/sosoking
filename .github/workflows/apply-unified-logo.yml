name: Apply unified logo assets

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/unify-logo-assets' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-logo-assets
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image processor
        run: npm install --save-dev sharp@0.33.5 --no-audit --no-fund

      - name: Apply unified logo patches
        run: node tools/apply-unified-logo.mjs

      - name: Generate all logo assets
        run: npm run prepare:icons

      - name: Validate repository
        run: npm run check

      - name: Commit generated assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json assets/brand/unified-logo.webp.b64 \
            tools/prepare-brand-icons.mjs tools/check-ui-audit.mjs tools/check-script-csp.mjs \
            public/logo.png public/og-image.png public/icons public/site.webmanifest public/sw.js \
            public/index.html public/admin/index.html public/css/brand-logo.css \
            public/js/app.js public/js/pages/home.js public/js/pages/home-court.js \
            public/js/pages/auth2.js public/js/components/nav.js public/js/components/footer.js
          git commit -m "Unify site and PWA logo assets"
          git push origin HEAD:agent/unify-logo-assets
