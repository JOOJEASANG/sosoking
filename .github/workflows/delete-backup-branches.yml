name: Delete Backup Branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-backup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete backup and cleanup branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            const explicitCleanupBranches = new Set([
              'backup-cleanup-safety-point-20260731',
              'agent/delete-backup-branches',
              'temp-cleanup-controller-20260731',
              'cleanup/delete-backups-20260731',
              'cleanup/backup-branch-removal-runner',
              'cleanup/backup-branch-removal-workflow'
            ]);

            const targets = branches
              .map(branch => branch.name)
              .filter(name => name.startsWith('backup/') || explicitCleanupBranches.has(name));

            const deleted = [];
            const failed = [];

            for (const name of targets) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`
                });
                deleted.push(name);
                core.info(`Deleted ${name}`);
              } catch (error) {
                failed.push(`${name}: ${error.message}`);
                core.warning(`Failed to delete ${name}: ${error.message}`);
              }
            }

            await core.summary
              .addHeading('Backup branch cleanup')
              .addRaw(`Deleted: ${deleted.length}\n`)
              .addRaw(`Failed: ${failed.length}\n`)
              .addCodeBlock(deleted.join('\n') || 'No matching branches found')
              .write();

            if (failed.length) {
              core.setFailed(failed.join('\n'));
            }
