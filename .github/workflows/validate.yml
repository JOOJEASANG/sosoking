name: Validate repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Check official seed cleanup script
        run: node --check tools/remove-official-seed.mjs

      - name: Run repository checks
        run: npm run check
