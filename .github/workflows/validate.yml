name: Validate Nostalgia Portal
on:
  pull_request:
    branches: [main]
  push:
    branches: [enhancement/brand-and-install-20261030]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Static and route checks
        run: |
          npm run check
      - name: Build and inspect new homepage
        run: |
          npm run build
          test -s dist/index.html
