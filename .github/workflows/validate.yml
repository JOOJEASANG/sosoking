name: Validate repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Build SEO case pages
        run: npm run build:seo

      - name: Check creative seed script syntax
        run: node --check tools/seed-creative-cases.mjs

      - name: Validate creative seed and SEO files
        run: node tools/check-seo-seed.mjs

      - name: Validate repository structure
        run: node tools/check-project.mjs
