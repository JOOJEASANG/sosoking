name: Apply legacy migration safety patch

on:
  push:
    branches: [agent/legacy-id-migration-policy]
    paths:
      - tools/patch-legacy-migration-safety.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-id-migration-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-legacy-migration-safety.mjs
      - run: node --check functions/legacy-case-migration.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/legacy-case-migration.js
          git diff --cached --quiet && exit 0
          git commit -m "Harden resumable legacy case migration"
          git push origin HEAD:agent/legacy-id-migration-policy
