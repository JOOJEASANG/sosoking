name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: firebase-deploy-live
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Install validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare exact uploaded logo icons
        run: npm run prepare:icons

      - name: Validate repository
        run: npm test

      - name: Prepare service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Prepare Functions environment
        env:
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK || 'false' }}
        run: |
          case "$ENFORCE_APP_CHECK" in
            true|false) ;;
            *)
              echo "ENFORCE_APP_CHECK must be either true or false."
              exit 1
              ;;
          esac
          if [ "$ENFORCE_APP_CHECK" = "true" ] && grep -Eq 'appCheckSiteKey:[[:space:]]*""' public/js/firebase-config.js; then
            echo "App Check enforcement cannot be enabled while appCheckSiteKey is empty."
            exit 1
          fi
          printf 'ENFORCE_APP_CHECK=%s\n' "$ENFORCE_APP_CHECK" > functions/.env.sosoking-481e6

      - name: Deploy current Functions first
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions:submitCase,functions:generateTrial,functions:generateDailyAiNow,functions:checkNickname,functions:setNickname,functions:voteResult,functions:addCourtComment,functions:addDiscussionComment,functions:createDripsoTopic,functions:createDripsoBattle,functions:submitDripsoBattleEntry,functions:getDripsoBattleView,functions:getDripsoBattleMatchup,functions:voteDripsoBattleMatchup,functions:addDripsoComment,functions:toggleDripsoCommentLike,functions:getDripsoOwnership,functions:deleteOwnDripsoTopic,functions:deleteOwnDripsoComment,functions:submitDripsoReport,functions:moderateDripsoReport,functions:setResultVisibility,functions:getPublicCaseOriginal,functions:setAdminResultVisibility,functions:submitReport,functions:moderateReport,functions:syncPublicStats,functions:syncPublicStatsNow,functions:publicResultPage,functions:publicSitemap,functions:resolveCaseAlias,functions:migrateLegacyCaseIds,functions:requestAppeal,functions:deleteOwnCourtPost,functions:deleteCourtPost,functions:deleteUserProfile --project sosoking-481e6 --non-interactive

      - name: Remove obsolete Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase functions:list --project sosoking-481e6 > "$RUNNER_TEMP/functions-list.txt"
          for function_name in createDailyAiCase getDailyRealCourt submitDailyRealCourtVerdict; do
            if grep -q "$function_name" "$RUNNER_TEMP/functions-list.txt"; then
              firebase functions:delete "$function_name" --region asia-northeast3 --force --project sosoking-481e6 --non-interactive
            else
              echo "$function_name is already absent."
            fi
          done

      - name: Verify deployed Functions match source
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase functions:list --project sosoking-481e6 --json > "$RUNNER_TEMP/functions-list.json"
          node tools/check-deployed-functions.mjs "$RUNNER_TEMP/functions-list.json"

      - name: Sanitize existing public results
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node functions/sanitize-public-results-cli.js

      - name: Reformat existing verdict number lines
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node functions/migrate-verdict-number-lines-cli.js

      - name: Deploy Firestore configuration and Hosting prerequisites
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:indexes,firestore:rules --project sosoking-481e6 --non-interactive

      - name: Initialize public statistics
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node functions/sync-public-stats-cli.js

      - name: Sync safe public configuration
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node tools/sync-public-config.mjs

      - name: Remove curated creative cases
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node tools/remove-official-seed.mjs

      - name: Deploy Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive

      - name: Deployment summary
        if: always()
        run: echo "Firebase Hosting, Functions, public original-case viewer, Dripso blind duels, moderation, deployed-function drift validation, existing verdict number-line migration, public result sanitation, and official seed cleanup finished for commit $GITHUB_SHA"
