name: Firebase 검증 및 전체 배포
run-name: Firebase 검증 및 전체 배포 · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - 'tools/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'package.json'
      - '.github/workflows/firebase-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - 'tools/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'package.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Cloud Functions 의존성 설치
        run: npm ci --prefix functions --no-audit --no-fund

      - name: 저장소 정적 검사
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: 정적 검사 로그 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-check-log
          path: check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Firebase CLI 설치
        if: github.event_name != 'pull_request'
        run: npm install --global firebase-tools

      - name: Firebase 서비스 계정 준비
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Gemini Secret 등록 확인
        if: github.event_name != 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          else
            echo "::notice::GitHub GEMINI_API_KEY secret이 없어 기존 Firebase Secret을 사용합니다."
          fi

      - name: Hosting·Firestore·Storage 배포
        if: github.event_name != 'pull_request'
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes,storage --non-interactive

      - name: Cloud Functions 배포
        if: github.event_name != 'pull_request'
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --force --non-interactive
