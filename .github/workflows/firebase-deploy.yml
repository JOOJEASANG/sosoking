name: 소문난 판결소 검증 및 Firebase 배포

on:
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "tools/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/firebase-deploy.yml"
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "tools/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: sosoking-court-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Functions 의존성 설치
        run: npm install --prefix functions --no-audit --no-fund

      - name: 정적 검사와 테스트
        run: |
          npm test
          npm run check
          npm run --prefix functions lint

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Functions 의존성 설치
        run: npm install --prefix functions --no-audit --no-fund

      - name: Firebase CLI 설치
        run: npm install --global firebase-tools

      - name: Firebase 서비스 계정 준비
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 기존 Gemini Secret 동기화
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          else
            echo "::notice::GitHub GEMINI_API_KEY가 비어 있어 기존 Firebase Secret을 유지합니다."
          fi

      - name: Functions와 Hosting 배포
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:generateCourtCase,hosting --force --non-interactive
