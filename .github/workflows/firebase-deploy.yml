# Deployment retrigger: 2026-08-10T12:34:00+09:00
name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: firebase-deploy-live
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Install validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare exact uploaded logo icons
        run: npm run prepare:icons

      - name: Validate repository
        run: npm test

      - name: Prepare service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Prepare App Check and Functions environment
        env:
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY || '' }}
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK || 'false' }}
        run: |
          node tools/configure-app-check.mjs
          printf 'ENFORCE_APP_CHECK=%s\n' "$ENFORCE_APP_CHECK" > functions/.env.sosoking-481e6

      - name: Deploy current Functions first
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions:submitCase,functions:generateTrial,functions:generateDailyAiNow,functions:checkNickname,functions:setNickname,functions:setProfilePhoto,functions:voteResult,functions:addCourtComment,functions:addDiscussionComment,functions:setResultVisibility,functions:getPublicCaseOriginal,functions:setAdminResultVisibility,functions:submitReport,functions:moderateReport,functions:syncPublicStats,functions:syncPublicStatsNow,functions:publicResultPage,functions:publicSitemap,functions:publicTagPage,functions:resolveCaseAlias,functions:migrateLegacyCaseIds,functions:requestAppeal,functions:deleteOwnCourtPost,functions:deleteCourtPost,functions:deleteUserProfile --project sosoking-481e6 --non-interactive

      - name: Remove known obsolete Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase functions:list --project sosoking-481e6 --json > "$RUNNER_TEMP/functions-before-cleanup.json"
          node tools/list-obsolete-deployed-functions.mjs "$RUNNER_TEMP/functions-before-cleanup.json" > "$RUNNER_TEMP/obsolete-functions.txt"

          if [ ! -s "$RUNNER_TEMP/obsolete-functions.txt" ]; then
            echo "No known obsolete Functions remain."
            exit 0
          fi

          mapfile -t obsolete_functions < "$RUNNER_TEMP/obsolete-functions.txt"
          echo "Removing ${#obsolete_functions[@]} known obsolete Functions."
          for ((i=0; i<${#obsolete_functions[@]}; i+=10)); do
            firebase functions:delete "${obsolete_functions[@]:i:10}" --force --project sosoking-481e6 --non-interactive
          done

      - name: Verify deployed Functions match source
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase functions:list --project sosoking-481e6 --json > "$RUNNER_TEMP/functions-list.json"
          node tools/check-deployed-functions.mjs "$RUNNER_TEMP/functions-list.json"

      - name: Sanitize existing public results
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node functions/sanitize-public-results-cli.js

      - name: Reformat existing verdict number lines
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node functions/migrate-verdict-number-lines-cli.js

      - name: Deploy Firestore configuration and Hosting prerequisites
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:indexes,firestore:rules --project sosoking-481e6 --non-interactive

      - name: Initialize public statistics
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node functions/sync-public-stats-cli.js

      - name: Sync safe public configuration
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node tools/sync-public-config.mjs

      - name: Remove curated creative cases
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: sosoking-481e6
        run: node tools/remove-official-seed.mjs

      - name: Deploy Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project sosoking-481e6 --non-interactive

      - name: Deployment summary
        if: always()
        run: echo "Firebase Hosting, current Functions, known legacy cleanup, deployed-function drift validation, Firestore configuration, public result sanitation, and official seed cleanup finished for commit $GITHUB_SHA"
