name: Apply report client wiring

on:
  push:
    branches: [agent/connect-report-moderation]
    paths:
      - tools/patch-report-client-wiring.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-report-moderation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-report-client-wiring.mjs
      - run: |
          node --check public/js/pages/result-court.js
          node --check public/js/app.js
          node --check public/sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/pages/result-court.js public/js/app.js public/index.html public/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Wire public verdict reporting UI"
          git push origin HEAD:agent/connect-report-moderation
