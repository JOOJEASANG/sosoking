name: AI 말투 프롬프트 보강 일회성 패치

on:
  push:
    branches:
      - agent/ai-human-witty-comments

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-human-witty-comments
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: AI 게시글·댓글 프롬프트 보강
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return updated

          comments_path = Path('functions/ai-character-comments-v2-functions.js')
          comments = comments_path.read_text(encoding='utf-8')

          character_block = r'''const CHARACTERS = [
  { id: 'minsu', name: '민수', emoji: '😂', role: '드립러', style: '핵심을 빨리 알아채고 일상 비유나 타이밍 좋은 한마디로 웃긴다. ㅋㅋ는 필요할 때 한 번만 쓰며 억지 밈은 피한다.' },
  { id: 'daon', name: '다온', emoji: '❤️', role: '공감러', style: '감정을 정확히 짚은 뒤 부담 없는 현실 조언을 준다. 가벼운 상황이면 따뜻한 유머를 한 스푼 섞는다.' },
  { id: 'jieun', name: '지은', emoji: '🧠', role: '분석러', style: '남들이 놓친 원인이나 기준을 짧고 똑똑하게 짚는다. 어려운 말 대신 선명한 비유로 이해와 재미를 함께 준다.' },
  { id: 'junho', name: '준호', emoji: '⚖️', role: '토론러', style: '반대편 논리와 판단 기준을 차분하게 제시한다. 마지막에는 재치 있는 한마디로 논점을 기억에 남긴다.' },
  { id: 'miyoung', name: '미영', emoji: '👵', role: '현실조언러', style: '생활 경험에서 나온 현실적인 행동 하나를 제안한다. 잔소리 대신 사람 냄새 나는 유쾌한 표현을 쓴다.' },
  { id: 'cheolgu', name: '철구', emoji: '😈', role: '반전러', style: '다들 놓친 불편한 포인트를 장난스럽게 찌른다. 까칠해도 모욕하지 않고 반전 있는 한 줄로 웃긴다.' },
  { id: 'haru', name: '하루', emoji: '🎨', role: '감성러', style: '장면과 감정을 담백하게 읽는다. 오글거리지 않는 신선한 표현과 잔잔한 위트로 여운을 만든다.' },
  { id: 'opsbot', name: '운영봇', emoji: '🤖', role: '진행자', style: '핵심 참여 포인트를 짧고 명확하게 정리한다. 딱딱한 공지체 대신 센스 있는 진행 멘트를 쓴다.' },
];'''
          comments = sub_once(
              comments,
              r"const CHARACTERS = \[[\s\S]*?\n\];(?=\n\nconst ROOM_CHARACTERS)",
              character_block,
              'character block',
          )

          room_block = r'''const ROOM_CHARACTERS = {
  judgment: ['junho', 'jieun', 'cheolgu'],
  consult: ['daon', 'miyoung', 'haru'],
  vote: ['junho', 'jieun', 'cheolgu'],
  drip: ['minsu', 'cheolgu', 'haru'],
};

const ROOM_GUIDANCE = {
  judgment: '사실관계와 판단 기준을 똑똑하게 짚되, 재판문처럼 딱딱하지 않게 쓴다. 상황의 아이러니를 가볍게 살려 유쾌하게 마무리한다.',
  consult: '공감과 도움이 먼저다. 상대가 힘든 글이면 웃기려 하지 말고 따뜻한 말맛만 살린다. 가벼운 고민이면 부담 없는 생활 유머를 섞는다.',
  vote: '찬반 어느 쪽도 단순화하지 말고 핵심 기준이나 예외를 하나 제시한다. 논점을 기억하게 만드는 재치 있는 비유나 한마디를 덧붙인다.',
  drip: '설명보다 펀치라인이 먼저다. 흔한 인터넷 유행어를 복사하지 말고 상황을 비튼 신선한 한 줄을 만든다.',
};'''
          comments = sub_once(
              comments,
              r"const ROOM_CHARACTERS = \{[\s\S]*?\n\};(?=\n\nconst FALLBACKS)",
              room_block,
              'room guidance',
          )

          fallback_block = r'''const FALLBACKS = {
  judgment: [
    '약속보다 반복 패턴이 더 큰 증거예요. 한 번은 사정이고 세 번이면 거의 정기구독이죠.',
    '사실과 기대를 나눠 보면 판단이 쉬워져요. 상대 입장에 빠진 장면이 있는지 확인하되, 내 시간도 무료 체험판은 아닙니다.',
    '“그럴 수도 있지”가 계속 쌓이면 배려 부족이 됩니다. 가장 불편했던 장면 하나가 판결의 결정적 증거 같아요.',
  ],
  consult: [
    '계속 마음에 남는 건 별일이 아니라는 뜻이 아니라 아직 정리가 안 됐다는 뜻일 수 있어요. 원하는 결과를 한 문장으로 적어보세요.',
    '오늘 할 수 있는 가장 작은 행동 하나만 정해보세요. 생각이 회전목마라면 행동은 일단 내리는 버튼입니다.',
    '정답을 급히 고르기보다 마음이 덜 흔들리는 방향부터 살펴봐도 괜찮아요. 마음도 업데이트 전에 백업이 필요할 때가 있거든요.',
  ],
  vote: [
    '찬반보다 어떤 기준을 먼저 두느냐가 핵심이에요. 내게 불리할 때도 같은 답을 할 수 있다면 꽤 튼튼한 기준입니다.',
    '상황·빈도·피해 정도를 나누면 양쪽 말이 성립하는 조건이 달라져요. 토론은 목소리 크기보다 조건문 싸움에 가깝죠.',
    '예외를 어디까지 허용할지가 핵심입니다. 원칙도 예외가 너무 많아지면 메뉴판이 됩니다.',
  ],
  drip: [
    '이건 상황 설명이 아니라 이미 예능 예고편입니다. 다음 장면 자막이 먼저 떠오르네요.',
    '현실이 드립 소재를 직접 배송했는데 배송비가 감정 소모네요.',
    '짧게 말할수록 더 아픈 주제입니다. 웃음 버튼과 한숨 버튼이 같은 자리에 있어요.',
  ],
};'''
          comments = sub_once(
              comments,
              r"const FALLBACKS = \{[\s\S]*?\n\};(?=\n\nfunction cleanId)",
              fallback_block,
              'fallback block',
          )

          comment_prompt = r'''  const prompt = `당신은 한국 온라인 커뮤니티에서 눈치 빠르고 말맛 좋은 실제 회원처럼 댓글을 씁니다.
소소킹 ${room} 게시물에 서로 성격이 확실히 다른 AI 캐릭터 댓글을 작성하세요.

제목: ${cleanText(post.title, 120)}
내용: ${cleanText(post.desc, 1000)}

이 글 유형의 말투 방향:
${ROOM_GUIDANCE[room]}

캐릭터:
${characters.map(character => `- ${character.id}: ${character.name}(${character.role}) - ${character.style}`).join('\n')}

반드시 지킬 품질 기준:
- 내용을 제대로 읽고, 각 댓글마다 남들이 놓칠 수 있는 핵심 관찰이나 도움 되는 생각을 최소 하나 담기
- 모든 댓글은 똑똑하지만 잘난 척하지 않고, 재밌고 유쾌하지만 억지로 웃기지 않기
- 캐릭터의 관점·어휘·리듬을 서로 확실히 다르게 만들기
- 교과서식 결론, AI 안내문 같은 말투, 뻔한 공감 문구, 같은 문장 구조 반복 금지
- 실제 한국인이 댓글로 쓸 법한 자연스러운 구어체 사용
- 상황에 맞으면 재치 있는 비유, 반전, 관찰형 유머, 짧은 펀치라인 중 하나를 자연스럽게 사용
- 상담·상처·불안이 큰 글은 공감과 안전을 우선하고 농담 강도를 낮추기
- 각 댓글은 1~3문장, 220자 이내
- ㅋㅋ, 이모지, 유행어는 캐릭터와 상황에 맞을 때만 절제해서 사용
- 실명 비방, 진단, 법률·의료 단정, 혐오·조롱·성적 표현 금지
- JSON만 출력

{"comments":[${characters.map(character => `{"id":"${character.id}","text":"사람처럼 자연스럽고 캐릭터다운 댓글"}`).join(',')}]}`;'''
          comments = sub_once(
              comments,
              r"  const prompt = `소소킹 \$\{room\} 커뮤니티 글에 AI 캐릭터 댓글을 작성하세요\.[\s\S]*?`;(?=\n\n  try \{)",
              comment_prompt,
              'comment prompt',
          )
          if comments.count('thinkingConfig: { thinkingBudget: 0 },') != 1:
              raise SystemExit('comment thinking config mismatch')
          comments = comments.replace(
              "temperature: 0.85,\n        topP: 0.95,\n        thinkingConfig: { thinkingBudget: 0 },",
              "temperature: 0.92,\n        topP: 0.95,\n        thinkingConfig: { thinkingBudget: 512 },",
              1,
          )
          comments_path.write_text(comments, encoding='utf-8')

          guidance_text = r'''

const PRESET_GUIDANCE = {
  judgment: '누가 더 잘못했는지 의견이 갈릴 만한 현실적인 생활 갈등을 만든다. 양쪽 사정이 모두 조금씩 이해되게 하고, 디테일 하나로 몰입과 재미를 만든다.',
  consult: '실제로 주변에 있을 법한 고민을 구체적인 장면으로 쓴다. 감정은 진짜 같아야 하며, 너무 무겁지 않은 주제에는 자기객관화가 느껴지는 가벼운 유머를 섞는다.',
  vote: '정답이 뻔하지 않고 댓글에서 논쟁할 기준이 있는 주제를 만든다. 찬반 모두 한마디 할 거리가 있도록 예외 상황이나 현실적 조건을 넣는다.',
  drip: '누구나 장면이 바로 떠오르면서도 뻔하지 않은 상황을 제시한다. 짧고 선명하며 여러 방향의 재치 있는 답이 나올 여지를 남긴다.',
};'''

          for file_name, daily in [
              ('functions/community-ai-content-functions.js', False),
              ('functions/daily-auto-post-v2-functions.js', True),
          ]:
              path = Path(file_name)
              source = path.read_text(encoding='utf-8')
              preset_line = "const PRESETS = ['judgment', 'consult', 'vote', 'drip'];" if daily else "const PRESETS = new Set(['judgment', 'consult', 'vote', 'drip']);"
              if source.count(preset_line) != 1:
                  raise SystemExit(f'{file_name}: preset anchor mismatch')
              source = source.replace(preset_line, preset_line + guidance_text, 1)

              if daily:
                  start_pattern = r"  const prompt = `소소킹 \$\{label\} 커뮤니티에 올릴 생활 밀착형 게시글 한 개를 작성하세요\.[\s\S]*?`;(?=\n  try \{)"
                  format_line = r'''형식: {"title":"","desc":"","tags":[""]${extra}}'''
              else:
                  start_pattern = r"  const prompt = `소소킹 \$\{label\} 커뮤니티에 올릴 생활 밀착형 게시글 하나를 작성하세요\.[\s\S]*?`;(?=\n  try \{)"
                  format_line = r'''형식: ${format}'''

              new_prompt = r'''  const prompt = `한국 온라인 커뮤니티에서 실제 사람이 올린 것처럼 자연스럽고 몰입되는 소소킹 ${label} 게시글 하나를 작성하세요.

주제 방향:
${PRESET_GUIDANCE[preset]}

품질 기준:
- 첫 문장부터 상황이 그려지도록 장소, 대화, 횟수, 금액, 시간 같은 구체적인 디테일을 1~2개 사용
- 뻔한 질문을 반복하지 말고, 댓글을 달고 싶게 만드는 갈등·반전·공감 포인트를 하나 넣기
- 똑똑하고 관찰력이 느껴지지만 작위적이거나 교훈적으로 쓰지 않기
- 실제 한국인이 쓰는 자연스러운 구어체로 작성하고 AI 안내문·기사체·과한 설명체 금지
- 재밌고 유쾌한 말맛을 살리되 고민이나 민감한 상황을 조롱하지 않기
- 제목은 호기심이 생기게 60자 이내, 본문은 120~500자, 태그 2~5개
- 실명, 정치 선동, 폭력 조장, 성적 소재, 혐오, 전문 의료·법률 단정 제외
- JSON만 출력
__FORMAT__`;'''.replace('__FORMAT__', format_line)
              source = sub_once(source, start_pattern, new_prompt, f'{file_name} prompt')

              old_config = "generationConfig: { responseMimeType: 'application/json', thinkingConfig: { thinkingBudget: 0 } },"
              new_config = "generationConfig: { responseMimeType: 'application/json', temperature: 0.9, topP: 0.95, thinkingConfig: { thinkingBudget: 768 } },"
              if source.count(old_config) != 1:
                  raise SystemExit(f'{file_name}: generation config mismatch')
              source = source.replace(old_config, new_config, 1)
              path.write_text(source, encoding='utf-8')

          Path('.github/workflows/ai-tone-patch-once.yml').unlink()
          PY

      - name: Functions 의존성 설치
        run: npm ci --prefix functions

      - name: 저장소 정적 검사
        run: npm run check

      - name: Gemini 실제 응답 스모크 테스트
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const { GoogleGenerativeAI } = require('./functions/node_modules/@google/generative-ai');
          const key = String(process.env.GEMINI_API_KEY || '').trim();
          if (!key) throw new Error('GEMINI_API_KEY가 비어 있습니다.');
          (async () => {
            const model = new GoogleGenerativeAI(key).getGenerativeModel({
              model: 'gemini-2.5-flash',
              generationConfig: { temperature: 0.7, thinkingConfig: { thinkingBudget: 128 } },
            });
            const result = await model.generateContent('한국어로 자연스러운 한 문장만 답하세요: 오늘도 잘 작동합니다.');
            const text = String(result.response.text() || '').trim();
            if (!text) throw new Error('Gemini 응답이 비어 있습니다.');
            console.log('Gemini smoke test passed');
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: 변경 내용 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/ai-character-comments-v2-functions.js functions/community-ai-content-functions.js functions/daily-auto-post-v2-functions.js .github/workflows/ai-tone-patch-once.yml
          git commit -m "AI 게시글과 댓글 말투를 사람답고 유쾌하게 보강"
          git push origin HEAD:agent/ai-human-witty-comments
