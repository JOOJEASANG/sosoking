name: 소문난 판결소 자동 사건기록 V6 미리보기

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"
  push:
    branches: [redesign/automatic-case-story-v6]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-automatic-story-v6-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  preview-and-verify-story:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'redesign/automatic-case-story-v6')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: V6 정적 검사
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase 준비
        run: npm install --global firebase-tools

      - name: 서비스 계정 연결
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: V6 미리보기 전용 함수 연결
        run: sed -i 's/"functionId": "generateCourtCase"/"functionId": "generateCourtCaseV6"/' firebase.json

      - name: V6 미리보기 배포
        id: preview
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-automatic-story-v6 --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: 자동 기록 화면 자산 검사
        run: |
          sleep 15
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" -o preview-index.html
          grep -q 'auto-story-v6.css' preview-index.html
          grep -q 'auto-story-v6.js' preview-index.html
          grep -q 'stage-settlement' preview-index.html
          grep -q 'stage-trial' preview-index.html
          grep -q 'stage-judgment' preview-index.html
          ! grep -q 'data-room=' preview-index.html
          ! grep -q 'data-verdict=' preview-index.html

      - name: Gemini 자동 사건 시나리오 검사
        run: |
          set -euo pipefail
          check_case() {
            name="$1"
            body="$2"
            shift 2
            file="case-${name}.json"
            status="$(curl --location --silent --show-error --max-time 70 \
              "$PREVIEW_URL/api/generate-case" \
              -H 'Content-Type: application/json' \
              -H 'X-Sosoking-Client: court-v6' \
              --data "$body" -o "$file" -w '%{http_code}')"
            test "$status" = "200"
            grep -q 'automatic-story-v6' "$file"
            grep -q '"settlement"' "$file"
            grep -q '"trial"' "$file"
            grep -q '"judgment"' "$file"
            for term in "$@"; do grep -q "$term" "$file"; done
          }
          check_case icecream '{"incident":"동생이 내 아이스크림을 너무 크게 한입 먹었다.","severity":"special"}' '아이스크림' '합의' '판결'
          check_case late '{"incident":"친구가 약속에 20분 늦고 커피도 안 샀다.","severity":"national"}' '20분' '커피'

      - name: 실제 브라우저 읽기형 UX 검사
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm install --no-save --no-audit --no-fund playwright-core
          cat > capture-v6.mjs <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ["--no-sandbox"] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          await page.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await page.screenshot({ path: "desktop-intake-v6.png", fullPage: true });
          await page.fill("#incident", "동생이 내 아이스크림을 너무 크게 한입 먹었다.");
          await page.click(".submit-case");
          await page.waitForSelector("#story-view:not([hidden])", { timeout: 65000 });
          const story = await page.locator("#story-view").innerText();
          for (const text of ["아이스크림", "사건 접수", "초동수사", "합의·조정", "재판 공방", "판결과 집행 이후"]) {
            if (!story.includes(text)) throw new Error(`자동 기록 누락: ${text}`);
          }
          if (await page.locator('[data-room]').count()) throw new Error("선택형 장소 버튼이 남아 있습니다.");
          if (await page.locator('[data-verdict]').count()) throw new Error("판결 선택 버튼이 남아 있습니다.");
          await page.screenshot({ path: "desktop-story-v6.png", fullPage: true });
          await page.locator("#stage-settlement").scrollIntoViewIfNeeded();
          await page.screenshot({ path: "desktop-settlement-v6.png", fullPage: false });
          await page.locator("#stage-judgment").scrollIntoViewIfNeeded();
          await page.screenshot({ path: "desktop-judgment-v6.png", fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await mobile.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await mobile.fill("#incident", "친구가 약속에 20분 늦고 커피도 안 샀다.");
          await mobile.click(".submit-case");
          await mobile.waitForSelector("#story-view:not([hidden])", { timeout: 65000 });
          const mobileStory = await mobile.locator("#story-view").innerText();
          if (!mobileStory.includes("20분") || !mobileStory.includes("커피")) throw new Error("모바일 자동 기록이 접수 내용과 연결되지 않았습니다.");
          await mobile.screenshot({ path: "mobile-story-v6.png", fullPage: true });
          await browser.close();
          JS
          CHROME_BIN="$chrome" node capture-v6.mjs
          rm capture-v6.mjs

      - name: V6 검증 결과 요약
        if: always()
        run: |
          {
            echo "## 소문난 판결소 자동 사건기록 V6"
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 사용자 선택 없이 사건 접수부터 판결·후일담까지 자동 진행했습니다."
            echo "- 합의·조정과 검사·변호인·증인·재판장 공방을 실제 화면에서 확인했습니다."
            echo "- 운영 Hosting은 변경하지 않았습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: V6 화면과 응답 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-automatic-story-v6-preview
          path: |
            preview-deploy.log
            preview-index.html
            case-icecream.json
            case-late.json
            desktop-intake-v6.png
            desktop-story-v6.png
            desktop-settlement-v6.png
            desktop-judgment-v6.png
            mobile-story-v6.png
          if-no-files-found: ignore
          retention-days: 7

      - name: V6 미리보기 상태 기록
        if: always() && github.event_name == 'push'
        env:
          PREVIEW_RESULT: ${{ job.status }}
          PREVIEW_URL_VALUE: ${{ steps.preview.outputs.preview_url }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
            "workflow": "소문난 판결소 자동 사건기록 V6 미리보기",
            "commit": os.environ.get("GITHUB_SHA"),
            "result": os.environ.get("PREVIEW_RESULT"),
            "preview_url": os.environ.get("PREVIEW_URL_VALUE", ""),
            "recorded_at": datetime.now(timezone.utc).isoformat()
          }
          with open(".github/v6-preview-status.json", "w", encoding="utf-8") as handle:
            json.dump(payload, handle, ensure_ascii=False, indent=2)
            handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v6-preview-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: V6 미리보기 상태 기록 [skip ci]"
          git push
