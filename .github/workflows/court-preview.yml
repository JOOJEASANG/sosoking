name: 소문난 판결소 수사게임 V4 미리보기

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-investigation-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  preview-and-play:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'redesign/sosoking-investigation-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 정적 검사
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase 준비
        run: npm install --global firebase-tools

      - name: 서비스 계정 연결
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 미리보기 전용 함수 연결
        run: |
          sed -i 's/"functionId": "generateCourtCase"/"functionId": "generateCourtCaseV3"/' firebase.json

      - name: V4 미리보기 배포
        id: preview
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-investigation-v4 --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: V4 자산 검사
        run: |
          sleep 15
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" -o preview-index.html
          grep -q 'command-center-v4.css' preview-index.html
          grep -q 'v4-runtime.js' preview-index.html
          grep -q 'data-room="forensics"' preview-index.html
          ! grep -q 'next-button' preview-index.html

      - name: V4 실제 게임 자동조작
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm install --no-save --no-audit --no-fund playwright-core
          cat > capture-v4.mjs <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ["--no-sandbox"] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          await page.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await page.screenshot({ path: "desktop-intake-v4.png", fullPage: true });
          await page.fill("#incident", "회사 냉장고에 넣어둔 푸딩 뚜껑만 남아 있었다.");
          await page.click(".launch-button");
          await page.waitForSelector("#loading-screen:not([hidden])");
          await page.screenshot({ path: "desktop-loading-v4.png", fullPage: true });
          await page.waitForSelector("#board-screen:not([hidden])", { timeout: 60000 });
          await page.screenshot({ path: "desktop-board-v4.png", fullPage: true });
          await page.click('[data-room="field"]');
          await page.click('[data-action="field"]');
          await page.click('[data-room="surveillance"]');
          await page.click('[data-disguise]');
          await page.click('[data-action="surveillance"]');
          await page.click('[data-room="forensics"]');
          const checks = page.locator('[data-evidence]');
          await checks.nth(0).check();
          await checks.nth(1).check();
          await page.click('[data-action="forensics"]');
          await page.screenshot({ path: "desktop-forensics-v4.png", fullPage: true });
          await page.click('[data-room="interrogation"]');
          await page.click('[data-q="0"][data-j="suspicious"]');
          await page.click('[data-q="1"][data-j="understood"]');
          await page.click('[data-action="interrogation"]');
          await page.click('[data-room="briefing"]');
          await page.click('[data-tone="초엄숙 발표"]');
          await page.click('[data-action="briefing"]');
          await page.click('[data-room="court"]');
          await page.click('[data-court-evidence]');
          await page.click('[data-verdict="0"]');
          await page.screenshot({ path: "desktop-court-v4.png", fullPage: true });
          await page.click('[data-action="court"]');
          await page.waitForSelector("#result-screen:not([hidden])");
          await page.screenshot({ path: "desktop-result-v4.png", fullPage: true });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await mobile.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await mobile.screenshot({ path: "mobile-intake-v4.png", fullPage: true });
          await mobile.fill("#incident", "친구가 약속에 20분 늦고 커피도 안 샀다.");
          await mobile.click(".launch-button");
          await mobile.waitForSelector("#board-screen:not([hidden])", { timeout: 60000 });
          await mobile.screenshot({ path: "mobile-board-v4.png", fullPage: true });
          await browser.close();
          JS
          CHROME_BIN="$chrome" node capture-v4.mjs
          rm capture-v4.mjs

      - name: 검증 결과 요약
        if: always()
        run: |
          {
            echo "## 소문난 판결소 수사게임 V4"
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 다음 단계 버튼 없이 여섯 장소를 직접 선택하고 완료했습니다."
            echo "- 운영 Hosting은 변경하지 않았습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 화면 캡처 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-investigation-v4-preview
          path: |
            preview-deploy.log
            preview-index.html
            desktop-intake-v4.png
            desktop-loading-v4.png
            desktop-board-v4.png
            desktop-forensics-v4.png
            desktop-court-v4.png
            desktop-result-v4.png
            mobile-intake-v4.png
            mobile-board-v4.png
          if-no-files-found: ignore
          retention-days: 7
