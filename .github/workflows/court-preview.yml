name: 소문난 판결소 접수 관련성 V5 미리보기

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-incident-relevance-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  preview-and-verify-relevance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/incident-relevance-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 정적 검사
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase 준비
        run: npm install --global firebase-tools

      - name: 서비스 계정 연결
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 미리보기 전용 함수 연결
        run: |
          sed -i 's/"functionId": "generateCourtCase"/"functionId": "generateCourtCaseV3"/' firebase.json

      - name: V5 미리보기 배포
        id: preview
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-incident-relevance-v5 --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: V5 자산 검사
        run: |
          sleep 15
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" -o preview-index.html
          grep -q 'command-center-v4.css' preview-index.html
          grep -q 'incident-relevance-v5.js' preview-index.html
          grep -q 'v4-runtime.js' preview-index.html
          test "$(grep -n 'incident-relevance-v5.js' preview-index.html | cut -d: -f1)" -lt "$(grep -n 'v4-runtime.js' preview-index.html | cut -d: -f1)"
          ! grep -q 'next-button' preview-index.html

      - name: Gemini 실제 응답 접수 소재 관련성 검사
        shell: bash
        run: |
          set -euo pipefail
          check_case() {
            name="$1"
            body="$2"
            shift 2
            file="case-${name}.json"
            curl --fail --location --silent --show-error --max-time 70 \
              "$PREVIEW_URL/api/generate-case" \
              -H 'Content-Type: application/json' \
              -H 'X-Sosoking-Client: court-v4' \
              --data "$body" -o "$file"
            grep -q '"case"' "$file"
            grep -q 'investigation-v5-relevance' "$file"
            for term in "$@"; do
              echo "${name}: ${term} 확인"
              grep -q "$term" "$file"
            done
          }
          check_case pudding '{"incident":"회사 냉장고에 넣어둔 푸딩 뚜껑만 남아 있었다.","severity":"special"}' '푸딩' '뚜껑'
          check_case remote '{"incident":"회의실 리모컨이 또 사라졌다.","severity":"official"}' '리모컨'
          check_case late '{"incident":"친구가 약속에 20분 늦고 커피도 안 샀다.","severity":"national"}' '20분' '커피'

      - name: V5 실제 게임 자동조작과 화면 관련성 검사
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm install --no-save --no-audit --no-fund playwright-core
          cat > capture-v5.mjs <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ["--no-sandbox"] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          await page.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await page.fill("#incident", "회사 냉장고에 넣어둔 푸딩 뚜껑만 남아 있었다.");
          await page.click(".launch-button");
          await page.waitForSelector("#board-screen:not([hidden])", { timeout: 65000 });
          const boardText = await page.locator("#board-screen").innerText();
          if (!boardText.includes("푸딩") || !boardText.includes("뚜껑")) throw new Error("데스크톱 사건보드에 푸딩·뚜껑 소재가 유지되지 않았습니다.");
          await page.screenshot({ path: "desktop-relevance-v5.png", fullPage: true });
          await page.click('[data-room="forensics"]');
          const forensicText = await page.locator("#mission-panel").innerText();
          if (!forensicText.includes("푸딩") && !forensicText.includes("뚜껑")) throw new Error("감식실에 접수 소재가 없습니다.");
          await page.screenshot({ path: "desktop-forensics-relevance-v5.png", fullPage: true });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await mobile.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await mobile.fill("#incident", "친구가 약속에 20분 늦고 커피도 안 샀다.");
          await mobile.click(".launch-button");
          await mobile.waitForSelector("#board-screen:not([hidden])", { timeout: 65000 });
          const mobileText = await mobile.locator("#board-screen").innerText();
          if (!mobileText.includes("20분") || !mobileText.includes("커피")) throw new Error("모바일 사건보드에 20분·커피 소재가 유지되지 않았습니다.");
          await mobile.screenshot({ path: "mobile-relevance-v5.png", fullPage: true });
          await browser.close();
          JS
          CHROME_BIN="$chrome" node capture-v5.mjs
          rm capture-v5.mjs

      - name: 검증 결과 요약
        if: always()
        run: |
          {
            echo "## 소문난 판결소 접수 관련성 V5"
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 푸딩·뚜껑, 리모컨, 20분·커피 세 사건의 서버 응답 관련성을 검사했습니다."
            echo "- 데스크톱과 모바일 사건보드 및 감식실에서 접수 소재가 유지되는지 확인했습니다."
            echo "- 운영 Hosting은 변경하지 않았습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 검증 기록 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-incident-relevance-v5-preview
          path: |
            preview-deploy.log
            preview-index.html
            case-pudding.json
            case-remote.json
            case-late.json
            desktop-relevance-v5.png
            desktop-forensics-relevance-v5.png
            mobile-relevance-v5.png
          if-no-files-found: ignore
          retention-days: 7