name: 소문난 판결소 미리보기 검증

on:
  push:
    branches: ["rebuild/sosoking-v2"]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "tools/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "tools/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write


env:
  FIREBASE_PROJECT_ID: sosoking-481e6
  PREVIEW_PR_NUMBER: "281"

jobs:
  preview-and-evaluate:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'rebuild/sosoking-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Functions 의존성 설치
        run: npm install --prefix functions --no-audit --no-fund

      - name: 정적 검사와 테스트
        run: |
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase CLI 설치
        run: npm install --global firebase-tools

      - name: Firebase 서비스 계정 준비
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 기존 Gemini Secret 동기화
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          else
            echo "::notice::GitHub GEMINI_API_KEY가 비어 있어 기존 Firebase Secret을 유지합니다."
          fi

      - name: 판결 생성 함수 미리보기용 배포
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:generateCourtCase --force --non-interactive

      - name: Hosting 미리보기 채널 배포
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-preview --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "미리보기 주소를 찾지 못했습니다."
            exit 1
          fi
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: 미리보기 응답 확인
        run: curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" >/dev/null

      - name: 대표 사건 1~10 실제 Gemini 평가
        id: evaluate_first
        continue-on-error: true
        env:
          COURT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          COURT_EVAL_OFFSET: "0"
          COURT_EVAL_LIMIT: "10"
        run: npm run evaluate 2>&1 | tee court-evaluation-part1.log

      - name: 요청 제한 창 초기화 대기
        run: sleep 610

      - name: 대표 사건 11~20 실제 Gemini 평가
        id: evaluate_second
        continue-on-error: true
        env:
          COURT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          COURT_EVAL_OFFSET: "10"
          COURT_EVAL_LIMIT: "10"
        run: npm run evaluate 2>&1 | tee court-evaluation-part2.log

      - name: 평가 결과 합치기
        if: always()
        shell: bash
        run: |
          {
            echo "===== 사건 1~10 ====="
            cat court-evaluation-part1.log 2>/dev/null || true
            echo
            echo "===== 사건 11~20 ====="
            cat court-evaluation-part2.log 2>/dev/null || true
          } > court-evaluation.log
          if [ "${{ steps.evaluate_first.outcome }}" != "success" ] || [ "${{ steps.evaluate_second.outcome }}" != "success" ]; then
            echo "대표 사건 평가에서 실패 항목이 있습니다."
            exit 1
          fi

      - name: 검증 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 소문난 판결소 미리보기"
            echo
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 운영 Hosting은 변경하지 않았습니다."
            echo "- 대표 사건 20개를 두 구간으로 나눠 실제 Gemini로 평가했습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Draft PR에 검증 결과 기록
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            const body = [
              `## ${ok ? '✅' : '⚠️'} 소문난 판결소 미리보기 검증`,
              '',
              `- 결과: **${ok ? '통과' : '확인 필요'}**`,
              `- 미리보기: ${process.env.PREVIEW_URL || '배포 주소 생성 실패'}`,
              `- Actions 실행: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- 운영 Hosting은 변경하지 않았습니다.',
              '- 평가 로그는 Actions의 `court-preview-evaluation` 아티팩트에 저장됩니다.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PREVIEW_PR_NUMBER),
              body
            });

      - name: 배포·평가 로그 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-preview-evaluation
          path: |
            preview-deploy.log
            court-evaluation.log
            court-evaluation-part1.log
            court-evaluation-part2.log
          if-no-files-found: ignore
          retention-days: 7
