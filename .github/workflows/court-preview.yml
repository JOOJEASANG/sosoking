name: 소문난 판결소 코미디 엔진 V7 미리보기

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-comedy-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  preview-and-verify-comedy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'redesign/comedy-engine-v7'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: V7 정적 검사
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase 준비
        run: npm install --global firebase-tools

      - name: 서비스 계정 연결
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: V7 미리보기 전용 함수 연결
        run: sed -i 's/"functionId": "generateCourtCaseV6"/"functionId": "generateCourtCaseV7"/' firebase.json

      - name: V7 미리보기 배포
        id: preview
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-comedy-v7 --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: V7 화면 자산 검사
        run: |
          sleep 15
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" -o preview-index.html
          grep -q 'auto-story-v7.js' preview-index.html
          grep -q 'comedy-v7.css' preview-index.html
          grep -q '반복 개그' preview-index.html
          grep -q '마지막 콜백' preview-index.html
          ! grep -q 'data-room=' preview-index.html
          ! grep -q 'data-verdict=' preview-index.html

      - name: Gemini 사건별 코미디 검사
        shell: bash
        run: |
          set -euo pipefail
          check_case() {
            name="$1"
            body="$2"
            shift 2
            file="case-${name}.json"
            status="$(curl --location --silent --show-error --max-time 70 \
              "$PREVIEW_URL/api/generate-case" \
              -H 'Content-Type: application/json' \
              -H 'X-Sosoking-Client: court-v7' \
              --data "$body" -o "$file" -w '%{http_code}')"
            test "$status" = "200"
            grep -q 'comedy-engine-v7' "$file"
            grep -q '"comicProfile"' "$file"
            grep -q '"comicBeats"' "$file"
            grep -q '"finalCallback"' "$file"
            for term in "$@"; do grep -q "$term" "$file"; done
            ! grep -q '마이크 7개\|3.7cm\|관심 없던 참고인\|사건은 작지만' "$file"
          }
          check_case icecream '{"incident":"동생이 내 아이스크림을 너무 크게 한입 먹었다.","severity":"special"}' '아이스크림' '한입'
          check_case late '{"incident":"친구가 약속에 20분 늦고 커피도 안 샀다.","severity":"national"}' '20분' '커피'
          check_case remote '{"incident":"회의실 리모컨이 또 사라졌다.","severity":"official"}' '리모컨'

      - name: 실제 브라우저 코미디 UX 검사
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm install --no-save --no-audit --no-fund playwright-core
          cat > capture-v7.mjs <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ["--no-sandbox"] });
          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          await desktop.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await desktop.fill("#incident", "동생이 내 아이스크림을 너무 크게 한입 먹었다.");
          await desktop.click(".submit-case");
          await desktop.waitForSelector("#story-view:not([hidden])", { timeout: 65000 });
          const story = await desktop.locator("#story-view").innerText();
          for (const text of ["아이스크림", "수사본부의 핵심 오해", "반복 쟁점", "기록관 주석", "마지막 콜백"]) {
            if (!story.includes(text)) throw new Error(`V7 코미디 화면 누락: ${text}`);
          }
          if (await desktop.locator(".comic-dna").count() !== 1) throw new Error("코미디 설계 카드가 없습니다.");
          if (await desktop.locator(".stage-punchline").count() !== 8) throw new Error("단계별 펀치라인이 8개가 아닙니다.");
          if (await desktop.locator('[data-room],[data-verdict]').count()) throw new Error("선택형 UI가 남아 있습니다.");
          await desktop.screenshot({ path: "desktop-comedy-v7.png", fullPage: true });
          await desktop.locator("#stage-judgment").scrollIntoViewIfNeeded();
          await desktop.screenshot({ path: "desktop-callback-v7.png", fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await mobile.goto(process.env.PREVIEW_URL, { waitUntil: "networkidle" });
          await mobile.fill("#incident", "친구가 약속에 20분 늦고 커피도 안 샀다.");
          await mobile.click(".submit-case");
          await mobile.waitForSelector("#story-view:not([hidden])", { timeout: 65000 });
          const mobileStory = await mobile.locator("#story-view").innerText();
          if (!mobileStory.includes("20분") || !mobileStory.includes("커피") || !mobileStory.includes("기록관 주석")) throw new Error("모바일 코미디 사건 연결 실패");
          await mobile.screenshot({ path: "mobile-comedy-v7.png", fullPage: true });
          await browser.close();
          JS
          CHROME_BIN="$chrome" node capture-v7.mjs
          rm capture-v7.mjs

      - name: V7 검증 결과 요약
        if: always()
        run: |
          {
            echo "## 소문난 판결소 코미디 엔진 V7"
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 사건별 중심 오해·반복 개그·8개 펀치라인·마지막 콜백을 검사했습니다."
            echo "- 아이스크림, 20분 지각·커피, 리모컨 사건을 실제 Gemini로 생성했습니다."
            echo "- 운영 Hosting은 변경하지 않았습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: V7 화면과 응답 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-comedy-v7-preview
          path: |
            preview-deploy.log
            preview-index.html
            case-icecream.json
            case-late.json
            case-remote.json
            desktop-comedy-v7.png
            desktop-callback-v7.png
            mobile-comedy-v7.png
          if-no-files-found: ignore
          retention-days: 7
