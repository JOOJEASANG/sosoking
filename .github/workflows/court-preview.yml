name: 소문난 판결소 미리보기 검증

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "tools/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  preview-and-evaluate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'rebuild/sosoking-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Functions 의존성 설치
        run: npm install --prefix functions --no-audit --no-fund

      - name: 정적 검사와 테스트
        run: |
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase CLI 설치
        run: npm install --global firebase-tools

      - name: Firebase 서비스 계정 준비
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 기존 Gemini Secret 동기화
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          else
            echo "::notice::GitHub GEMINI_API_KEY가 비어 있어 기존 Firebase Secret을 유지합니다."
          fi

      - name: 판결 생성 함수 미리보기용 배포
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:generateCourtCase --force --non-interactive

      - name: Hosting 미리보기 채널 배포
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-preview --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "미리보기 주소를 찾지 못했습니다."
            exit 1
          fi
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: 미리보기 응답 확인
        run: curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" >/dev/null

      - name: 대표 사건 20개 실제 Gemini 평가
        env:
          COURT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          COURT_EVAL_LIMIT: "20"
        run: npm run evaluate 2>&1 | tee court-evaluation.log

      - name: 검증 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 소문난 판결소 미리보기"
            echo
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 운영 Hosting은 변경하지 않았습니다."
            echo "- 대표 사건 평가 결과는 첨부 로그에서 확인합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 배포·평가 로그 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-preview-evaluation
          path: |
            preview-deploy.log
            court-evaluation.log
          if-no-files-found: ignore
          retention-days: 7
