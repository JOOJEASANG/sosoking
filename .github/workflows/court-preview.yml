name: 소문난 판결소 수사본부 V3 미리보기

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "functions/**"
      - "tests/**"
      - "tools/**"
      - "firebase.json"
      - "package.json"
      - ".github/workflows/court-preview.yml"

concurrency:
  group: court-investigation-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: sosoking-481e6

jobs:
  preview-and-evaluate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'redesign/sosoking-investigation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Functions 의존성 설치
        run: npm install --prefix functions --no-audit --no-fund

      - name: 정적 검사와 테스트
        run: |
          npm test
          npm run check
          npm run --prefix functions lint

      - name: Firebase CLI 설치
        run: npm install --global firebase-tools

      - name: Firebase 서비스 계정 준비
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 기존 Gemini Secret 동기화
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          else
            echo "::notice::GitHub GEMINI_API_KEY가 비어 있어 기존 Firebase Secret을 유지합니다."
          fi

      - name: 미리보기 전용 함수와 평가 한도 적용
        run: |
          sed -i 's/const RATE_LIMIT = 12;/const RATE_LIMIT = 30;/' functions/gemini-court-investigation.js
          sed -i 's/"functionId": "generateCourtCase"/"functionId": "generateCourtCaseV3"/' firebase.json

      - name: V3 함수와 Hosting 미리보기 채널 배포
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy court-investigation-v3 --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.(web\.app|firebaseapp\.com)' preview-deploy.log | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "미리보기 주소를 찾지 못했습니다."
            exit 1
          fi
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: 미리보기 HTML과 디자인 자산 확인
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 "$PREVIEW_URL/" -o preview-index.html
          grep -q 'investigation.css' preview-index.html
          grep -q 'court-v3.js' preview-index.html
          grep -q '별일 아니어도' preview-index.html
          curl --fail --location "$PREVIEW_URL/investigation.css" >/dev/null
          curl --fail --location "$PREVIEW_URL/court-v3.js" >/dev/null
          curl --fail --location "$PREVIEW_URL/investigation-icons.svg" >/dev/null

      - name: 모바일·데스크톱 첫 화면 캡처
        continue-on-error: true
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome 실행 파일을 찾지 못해 화면 캡처를 건너뜁니다."
            exit 0
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=mobile-home-v3.png "$PREVIEW_URL/"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --screenshot=desktop-home-v3.png "$PREVIEW_URL/"

      - name: Gemini 단건 상세 수사 검사
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          COURT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          COURT_EVAL_OFFSET: "0"
          COURT_EVAL_LIMIT: "1"
        run: |
          set -o pipefail
          npm run evaluate 2>&1 | tee court-smoke-v3.log

      - name: 대표 사건 20개 상세 수사 평가
        id: evaluate
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          COURT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          COURT_EVAL_OFFSET: "0"
          COURT_EVAL_LIMIT: "20"
        run: |
          set -o pipefail
          npm run evaluate 2>&1 | tee court-evaluation-v3.log

      - name: V3 함수 요청 한도 정상값 복원
        if: always() && steps.preview.outcome == 'success'
        shell: bash
        run: |
          git checkout -- functions/gemini-court-investigation.js firebase.json
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:generateCourtCaseV3 --force --non-interactive 2>&1 | tee function-v3-restore.log

      - name: 평가 통과 확인
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" != "success" ] || [ "${{ steps.evaluate.outcome }}" != "success" ]; then
            echo "V3 스모크 테스트 또는 대표 사건 평가에서 실패했습니다."
            exit 1
          fi

      - name: 검증 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 소문난 판결소 수사본부 V3"
            echo
            echo "- 미리보기 주소: ${{ steps.preview.outputs.preview_url || '배포 실패' }}"
            echo "- 운영 Hosting과 기존 generateCourtCase 함수는 변경하지 않았습니다."
            echo "- 작전본부 UI, 잠복수사, 과잉감식, 압수수색, 브리핑, 판결을 검증합니다."
            echo "- 단건 검사 통과 후 대표 사건 20개를 평가합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 배포·평가·화면 캡처 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-investigation-v3-evaluation
          path: |
            preview-deploy.log
            preview-index.html
            court-smoke-v3.log
            court-evaluation-v3.log
            function-v3-restore.log
            mobile-home-v3.png
            desktop-home-v3.png
          if-no-files-found: ignore
          retention-days: 7
