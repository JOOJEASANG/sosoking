name: Game Hub Preview

on:
  push:
    branches:
      - agent/game-hub
    paths:
      - '.github/workflows/firebase-game-preview.yml'
      - 'public/game/**'
      - 'public/dripso/index.html'
      - 'public/index.html'
      - 'public/css/game-entry.css'
      - 'public/js/game-entry-guard.js'
      - 'firestore.rules'
      - 'tools/check-game-site.mjs'
      - 'tools/check-game-rules.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: firebase-game-hub-preview
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Functions test dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Validate repository and Firestore rules
        run: npm test

      - name: Prepare service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_SOSOKING_481E6"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy tested game room rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project sosoking-481e6 --non-interactive

      - name: Deploy game hub preview channel
        id: hosting_preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -o pipefail
          OUTPUT="$(firebase hosting:channel:deploy game-hub-425 --expires 7d --project sosoking-481e6 --non-interactive 2>&1)"
          printf '%s\n' "$OUTPUT"
          PREVIEW_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.web\.app' | tail -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Preview deployment succeeded but the preview URL could not be parsed."
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment smartphone test URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 425 --repo "$GITHUB_REPOSITORY" --body "🎮 **게임소 스마트폰 테스트 URL (최신 Preview)**\n\n${PREVIEW_URL}/game/\n\n- 💣 초성 폭탄: ${PREVIEW_URL}/game/chosung/\n- 🧠 관심법: ${PREVIEW_URL}/game/mind/\n- 🧾 변명거래소: ${PREVIEW_URL}/game/alibi/\n- Firebase Hosting Preview 채널: game-hub-425\n- 7일 후 자동 만료\n\n이 URL은 테스트용이며 운영 sosoking.co.kr Hosting은 변경하지 않았습니다."
