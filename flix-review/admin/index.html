<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소소킹 로컬 관리자</title><style>body{font:16px system-ui;background:#101116;color:#eee;max-width:1000px;margin:auto;padding:20px}section{background:#20212a;padding:18px;margin:16px 0;border-radius:12px}button,input,select,textarea{font:inherit;padding:8px;margin:4px;background:#30323d;color:white;border:1px solid #777;border-radius:6px}label{display:block}textarea{width:95%;min-height:100px}button{cursor:pointer}a{color:#ff9ca4}#message{white-space:pre-wrap}article{border-top:1px solid #555;padding:12px}img{width:160px;max-width:100%}</style><h1>소소킹 작품 관리</h1><p>로컬 전용 편집 도구입니다. 공개 사이트나 Firebase에는 직접 저장하지 않습니다. 검토한 카탈로그를 내려받아 GitHub PR로 반영하세요.</p><section><label>현재 카탈로그 JSON <input id="catalogFile" type="file" accept=".json"></label><label>수집 후보 JSON <input id="candidateFile" type="file" accept=".json"></label><label>재생 상태 JSON <input id="healthFile" type="file" accept=".json"></label><p id="summary"></p></section><section><h2>작품 및 회차 관리</h2><select id="works"></select><button id="newWork">새 작품</button><button id="removeWork">작품 삭제</button><form id="editor"><label>작품 ID <input name="id" required pattern="[a-z0-9][a-z0-9-]{0,79}"></label><label>제목 <input name="title" required></label><label>제작자 <input name="creator" required></label><label>장르 <input name="genre" required></label><label>언어 <input name="language" required value="한국어"></label><label>유형 <select name="type"><option>드라마</option><option>영화</option><option>애니메이션</option></select></label><label>상태 <select name="status"><option>완결</option><option>연재 중</option></select></label><label>소개 <textarea name="description" required></textarea></label><h3>회차</h3><div id="episodes"></div><button type="button" id="addEpisode">회차 추가</button><button type="submit">작품 변경 저장</button></form></section><section><h2>수집 후보 검토</h2><p>원본에서 AI 제작, 한국어, 권리 및 재생 가능 여부를 확인한 뒤 선택한 작품에 추가하세요.</p><input id="query" placeholder="제목 또는 제작자 검색"><div id="candidates"></div></section><section><h2>검토 결과</h2><button id="download">검증 후 카탈로그 내려받기</button><p id="message" role="status"></p></section><script type="module" src="./admin.js"></script></html>
